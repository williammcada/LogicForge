function requireText(value, label) {
  if (typeof value !== 'string') {
    const actual = Array.isArray(value) ? 'an array' : value === null ? 'null' : `a ${typeof value}`;
    throw new Error(`Import rejected at ${label}: expected text but received ${actual}.`);
  }
}

function requireNumber(value, label, min = -100, max = 2100) {
  if (!Number.isFinite(value) || value < min || value > max) throw new Error(`${label} is outside the allowed drawing range.`);
}

function requireColor(value, label) {
  if (typeof value !== 'string' || !/^(?:#[0-9A-Fa-f]{6}|none)$/.test(value)) throw new Error(`${label} must be a six-digit hex color or none.`);
}

function validateCaseVisual(visual) {
  if (!visual || typeof visual !== 'object' || Array.isArray(visual)) throw new Error('The case illustration is missing.');
  requireText(visual.alt, 'Case illustration alt text');
  requireText(visual.caption, 'Case illustration caption');
  requireNumber(visual.width, 'Case illustration width', 400, 1200);
  requireNumber(visual.height, 'Case illustration height', 200, 700);
  requireColor(visual.background, 'Case illustration background');
  if (!Array.isArray(visual.shapes) || visual.shapes.length > 80) throw new Error('Case illustration shapes must be a bounded array.');
  if (!Array.isArray(visual.labels) || visual.labels.length > 20) throw new Error('Case illustration labels must be a bounded array.');
  visual.shapes.forEach((shape, index) => {
    if (!shape || typeof shape !== 'object' || !['rect', 'circle', 'line', 'polygon'].includes(shape.type)) throw new Error(`Case illustration shape ${index + 1} has an unsupported type.`);
    for (const key of ['stroke', ...(shape.type === 'line' ? [] : ['fill'])]) requireColor(shape[key], `Case illustration shape ${index + 1} ${key}`);
    requireNumber(shape.strokeWidth, `Case illustration shape ${index + 1} stroke width`, 0, 20);
    if (shape.type === 'rect') {
      for (const key of ['x', 'y', 'width', 'height', 'rx']) requireNumber(shape[key], `Case illustration rectangle ${key}`, key === 'x' || key === 'y' ? -100 : 0, 2100);
    } else if (shape.type === 'circle') {
      for (const key of ['cx', 'cy', 'r']) requireNumber(shape[key], `Case illustration circle ${key}`, key === 'r' ? 0 : -100, 2100);
    } else if (shape.type === 'line') {
      for (const key of ['x1', 'y1', 'x2', 'y2']) requireNumber(shape[key], `Case illustration line ${key}`);
    } else {
      if (!Array.isArray(shape.points) || shape.points.length < 3 || shape.points.length > 24 || shape.points.some(point => !Array.isArray(point) || point.length !== 2 || point.some(value => !Number.isFinite(value)))) throw new Error('Case illustration polygons need 3–24 numeric points.');
    }
  });
  visual.labels.forEach((label, index) => {
    if (!label || typeof label !== 'object') throw new Error(`Case illustration label ${index + 1} is invalid.`);
    requireNumber(label.x, `Case illustration label ${index + 1} x`);
    requireNumber(label.y, `Case illustration label ${index + 1} y`);
    requireNumber(label.size, `Case illustration label ${index + 1} size`, 8, 72);
    requireText(label.text, `Case illustration label ${index + 1} text`);
    if (label.text.length > 60) throw new Error('Case illustration labels must stay concise.');
    requireColor(label.fill, `Case illustration label ${index + 1} fill`);
    if (!['start', 'middle', 'end'].includes(label.anchor)) throw new Error('Case illustration label anchors must be start, middle, or end.');
  });
}

function validateFigure(figure) {
  requireText(figure?.id, 'Figure ID');
  requireText(figure?.caption, 'Figure caption');
  if (!(Number.isFinite(figure.width) && figure.width > 0 && figure.width <= 2000 && Number.isFinite(figure.height) && figure.height > 0 && figure.height <= 2000)) throw new Error('Figure dimensions must be between 1 and 2000.');
  for (const key of ['lines', 'circles', 'labels', 'measurements']) if (!Array.isArray(figure[key]) || figure[key].length > 1000) throw new Error(`Figure ${key} must be a bounded array.`);
  figure.lines.forEach(line => ['x1', 'y1', 'x2', 'y2'].forEach(key => { if (!Number.isFinite(line[key])) throw new Error('A figure line has an invalid coordinate.'); }));
  figure.circles.forEach(circle => ['cx', 'cy', 'r'].forEach(key => { if (!Number.isFinite(circle[key]) || (key === 'r' && circle[key] < 0)) throw new Error('A figure circle has an invalid coordinate.'); }));
  figure.labels.forEach(label => {
    if (!Number.isFinite(label.x) || !Number.isFinite(label.y)) throw new Error('A figure label has an invalid coordinate.');
    requireText(label.text, 'Figure label');
    if (label.text.length > 24) throw new Error('Figure labels must be short. Put measurements in the companion table.');
    if (label.anchor !== undefined && !['start', 'middle', 'end'].includes(label.anchor)) throw new Error('Figure label anchors must be start, middle, or end.');
  });
  figure.measurements.forEach(item => {
    if (!item || typeof item !== 'object') throw new Error('A figure measurement row is invalid.');
    requireText(item.label, 'Figure measurement label');
    requireText(item.value, 'Figure measurement value');
  });
}

function validateGeneratedCandidates(actual, planned, label, profile = false) {
  if (!Array.isArray(actual) || actual.length !== planned.length) throw new Error(`${label} count changed.`);
  if (new Set(actual.map(item => item.id)).size !== actual.length) throw new Error(`${label} IDs must be unique.`);
  actual.forEach(item => {
    const source = planned.find(candidate => candidate.id === item.id);
    if (!source) throw new Error(`${label} ID changed.`);
    requireText(item.name, `${label} name`);
    if (!item.name.trim()) throw new Error(`${label} names cannot be blank.`);
    if ((label === 'Suspect' && (!P.naming || P.naming.mode === 'Keep current names' || source.nameLocked)) || (label !== 'Suspect' && source.nameMode !== 'AI chooses')) {
      if (item.name !== source.name) throw new Error(`${label} teacher-supplied name changed.`);
    } else if (label !== 'Suspect' && (/^(?:location|room|place|object|item)\s+(?:[A-Z]|\d+)$/i.test(item.name.trim()) || [...COMMON_NAMES, ...GLOBAL_NAMES, ...P.candidates.suspects.map(item => item.name)].some(name => normalizedWords(name) === normalizedWords(item.name)))) {
      throw new Error(`${label} “${item.name}” needs a concrete, contextual name, not a human name or stand-in.`);
    }
    requireText(item.description, `${label} description`);
    if (label === 'Suspect') {
      requireText(item.role, 'Suspect role');
      requireText(item.statement, 'Suspect statement');
      requireText(item.accessAlibi, 'Suspect access/alibi');
      if (!item.attributes || typeof item.attributes !== 'object' || Array.isArray(item.attributes)) throw new Error('Suspect attributes must be an object.');
      if (profile) P.profileAttributes.forEach(attribute => requireText(item.attributes[attribute.id], `Attribute ${attribute.label}`));
    }
  });
  if (new Set(actual.map(item => normalizedWords(item.name))).size !== actual.length) throw new Error(`${label} names must be distinct.`);
}

function evaluatePredicate(predicate, entry) {
  const operator = predicate.operator;
  const numeric = entry.numericValue;
  if (operator === 'equals') return entry.key === predicate.referenceValueKey || entry.display === predicate.referenceValue;
  if (operator === 'isTrue') return entry.value === true || entry.key === 'true';
  if (operator === 'inSet') return predicate.trueValueKeys.includes(entry.key);
  if (operator === 'isOdd') return Number.isInteger(numeric) && Math.abs(numeric % 2) === 1;
  if (operator === 'isEven') return Number.isInteger(numeric) && numeric % 2 === 0;
  if (operator === 'divisibleBy') return Number.isInteger(numeric) && Number.isFinite(predicate.operand) && predicate.operand !== 0 && numeric % predicate.operand === 0;
  if (operator === 'greaterThan') return Number.isFinite(numeric) && numeric > predicate.operand;
  if (operator === 'lessThan') return Number.isFinite(numeric) && numeric < predicate.operand;
  if (operator === 'betweenInclusive') return Number.isFinite(numeric) && numeric >= predicate.minimum && numeric <= predicate.maximum;
  throw new Error(`Unsupported predicate operator ${operator || 'blank'}.`);
}

function containsGenderedLanguage(text) {
  return /\b(?:he|she|his|her|hers|him|himself|herself|male|female|man|woman|boy|girl|gent|gents|gentleman|lady)\b/i.test(String(text || ''));
}

function validateMatrixResult(result) {
  if (P.gameMode !== 'matrix') return;
  const issues = matrixIssues();
  if (issues.some(item => item.level === 'error')) throw new Error(issues.find(item => item.level === 'error').text);
  const content = result.matrixContent;
  if (!content || typeof content !== 'object' || Array.isArray(content)) throw new Error('matrixContent is missing.');
  if (!Array.isArray(content.fields) || content.fields.length !== 5 || new Set(content.fields.map(item => item.fieldId)).size !== 5) throw new Error('Return all five matrixContent fields with their stable IDs.');
  if (!content.assignments || typeof content.assignments !== 'object' || Array.isArray(content.assignments)) throw new Error('matrixContent.assignments must be an object.');
  if (!Array.isArray(result.glossary) || !Array.isArray(result.referenceGuides) || !Array.isArray(result.autotags)) throw new Error('glossary, referenceGuides, and autotags must be arrays.');

  const glossaryIds = new Set();
  result.glossary.forEach((entry, index) => {
    for (const key of ['id', 'term', 'displayTerm', 'meaning', 'clueRelevantFact', 'example', 'sourceUrl']) requireText(entry?.[key], `glossary[${index}].${key}`);
    if (!entry.id || glossaryIds.has(entry.id)) throw new Error(`glossary[${index}].id must be nonblank and unique.`);
    glossaryIds.add(entry.id);
    if (typeof entry.generalSupport !== 'boolean') throw new Error(`glossary[${index}].generalSupport must be true or false.`);
    if (!entry.meaning.trim() || !entry.clueRelevantFact.trim() || !entry.example.trim()) throw new Error(`Glossary term ${entry.displayTerm || entry.term} needs a definition, clue-relevant fact, and example.`);
    if (entry.sourceUrl && !/^https:\/\/[^\s<>"']+$/i.test(entry.sourceUrl)) throw new Error(`Glossary term ${entry.displayTerm || entry.term}: sourceUrl must be a complete HTTPS URL or empty.`);

  });
  const autotagIds = new Set();
  result.autotags.forEach((tag, index) => {
    for (const key of ['id', 'targetType', 'targetId', 'glossaryId']) requireText(tag?.[key], `autotags[${index}].${key}`);
    if (!tag.id || autotagIds.has(tag.id)) throw new Error(`autotags[${index}].id must be nonblank and unique.`);
    autotagIds.add(tag.id);
    if (!glossaryIds.has(tag.glossaryId)) throw new Error(`autotags[${index}] references a missing glossary entry.`);
  });

  const culpritRow = P.matrix.rows[P.solution.suspectId];
  content.fields.forEach((field, fieldIndex) => {
    const planned = matrixFields()[fieldIndex];
    if (!planned || field.fieldId !== planned.id || field.label !== planned.label) throw new Error('A field ID, order, or teacher-supplied heading changed.');
    requireText(field.valueType, `matrixContent.fields[${fieldIndex}].valueType`);
    if (!CONTRACT.valueTypes.includes(field.valueType)) throw new Error(`Field ${planned.label}: generated valueType must be Text category, Number, Boolean, or Sex and Gender.`);
    if (planned.valueType !== 'Auto' && field.valueType !== planned.valueType) throw new Error(`Field ${planned.label}: value type changed.`);
    if (!Array.isArray(field.valueCatalog) || field.valueCatalog.length < 2) throw new Error(`Field ${planned.label}: valueCatalog needs classified values.`);
    const keys = field.valueCatalog.map(value => value.key);
    if (keys.some(key => typeof key !== 'string' || !key.trim()) || new Set(keys).size !== keys.length) throw new Error(`Field ${planned.label}: catalog keys must be nonblank and unique.`);
    field.valueCatalog.forEach((value, valueIndex) => {
      requireText(value.display, `matrixContent.fields[${fieldIndex}].valueCatalog[${valueIndex}].display`);
      if (!value.display.trim() || ![0, 1].includes(value.truth)) throw new Error(`Field ${planned.label}: every catalog value needs display text and truth 0 or 1.`);
      if (field.valueType === 'Number' && !Number.isFinite(value.numericValue)) throw new Error(`Field ${planned.label}: numeric value ${value.display} needs numericValue while keeping its display text.`);
      if (!Array.isArray(value.glossaryIds) || value.glossaryIds.some(id => !glossaryIds.has(id))) throw new Error(`Field ${planned.label}: ${value.display} has invalid glossaryIds.`);
    });
    if (!field.predicate || typeof field.predicate !== 'object' || Array.isArray(field.predicate)) throw new Error(`Field ${planned.label}: predicate is missing.`);
    for (const key of ['operator', 'trueLabel', 'falseLabel']) requireText(field.predicate[key], `Field ${planned.label} predicate ${key}`);
    if (!Array.isArray(field.predicate.trueValueKeys)) throw new Error(`Field ${planned.label}: predicate.trueValueKeys must be an array.`);
    if (planned.predicateMode === 'Teacher supplied' && field.predicate.operator !== planned.predicateOperator) throw new Error(`Field ${planned.label}: teacher-supplied predicate operator changed.`);
    if (planned.predicateMode === 'Teacher supplied') {
      for(const [key,source] of [['operand','predicateOperand'],['minimum','predicateMinimum'],['maximum','predicateMaximum']]) {
        if(['divisibleBy','greaterThan','lessThan','betweenInclusive'].includes(planned.predicateOperator) && String(planned[source]??'').trim() && field.predicate[key]!==Number(planned[source])) throw new Error(`Field ${planned.label}: teacher-supplied ${key} changed.`);
      }
    }
    field.valueCatalog.forEach(value => {
      const evaluated = Number(evaluatePredicate(field.predicate, value));
      if (evaluated !== value.truth) throw new Error(`Field ${planned.label}: value ${value.display} is classified ${value.truth ? 'true' : 'false'} but the predicate evaluates ${evaluated ? 'true' : 'false'}.`);
    });
    if (planned.valueMode === 'Teacher supplied catalog') {
      const manual = parseManualCatalog(planned);
      manual.forEach(item => {
        const actual = field.valueCatalog.find(value => normalizedWords(value.display) === normalizedWords(item.display));
        if (!actual || actual.truth !== item.truth || (planned.valueType === 'Number' && actual.numericValue !== item.numericValue)) throw new Error(`Field ${planned.label}: teacher-supplied value ${item.display} changed or was reclassified.`);
      });
    }
    if (!field.clue || typeof field.clue !== 'object' || Array.isArray(field.clue)) throw new Error(`Field ${planned.label}: clue object is missing.`);
    for (const key of ['positiveText', 'negativeText', 'selectedPolarity', 'decoderPayload']) requireText(field.clue[key], `Field ${planned.label} clue ${key}`);
    if (!field.clue.positiveText.trim() || !field.clue.negativeText.trim() || !field.clue.decoderPayload.trim()) throw new Error(`Field ${planned.label}: both clue phrasings and the selected decoder payload are required.`);
    if (normalizedWords(field.clue.positiveText) === normalizedWords(field.clue.negativeText)) throw new Error(`Field ${planned.label}: positive and negative clue wording must be distinct.`);
    if (planned.clueMode === 'Teacher supplied' && (field.clue.positiveText !== planned.positiveClue || field.clue.negativeText !== planned.negativeClue)) throw new Error(`Field ${planned.label}: teacher-supplied clue wording changed.`);
    const expectedPolarity = culpritRow[fieldIndex] ? 'positive' : 'negative';
    if (field.clue.selectedPolarity !== expectedPolarity) throw new Error(`Field ${planned.label}: selectedPolarity must be ${expectedPolarity} for the locked culprit row.`);
    if (planned.clueMode === 'Teacher supplied' && field.clue.decoderPayload !== (expectedPolarity === 'positive' ? planned.positivePayload : planned.negativePayload)) throw new Error(`Field ${planned.label}: teacher-supplied decoder payload changed.`);
    if (field.valueType !== 'Sex and Gender' && containsGenderedLanguage(`${field.clue.positiveText} ${field.clue.negativeText}`)) throw new Error(`Field ${planned.label}: a non-gender clue uses gendered wording. Use M, killer, murderer, thief, poisoner, or criminal.`);
    const clueWords = ` ${normalizedWords(`${field.clue.positiveText} ${field.clue.negativeText} ${field.clue.decoderPayload}`)} `;
    if (result.suspects.some(suspect => clueWords.includes(` ${normalizedWords(suspect.name)} `)) || /\b(?:SUS|FIELD|ACT|CLUE)-/i.test(`${field.clue.positiveText} ${field.clue.negativeText} ${field.clue.decoderPayload}`)) throw new Error(`Field ${planned.label}: clue wording may not name a suspect or expose a stable ID.`);
    if (unsupportedClueCharacters(field.clue.decoderPayload) || !normalizedClue(field.clue.decoderPayload)) throw new Error(`Field ${planned.label}: decoderPayload must use alphabetic clue text compatible with the existing decoders.`);

    const assignedKeys = [];
    P.candidates.suspects.forEach(suspect => {
      const row = content.assignments[suspect.id];
      if (!row || typeof row !== 'object' || Array.isArray(row)) throw new Error(`Suspect ${suspect.name}: assignment row is missing.`);
      const key = row[field.fieldId];
      const entry = field.valueCatalog.find(value => value.key === key);
      if (!entry) throw new Error(`Suspect ${suspect.name}, ${planned.label}: assigned key ${key || '(blank)'} is not in the value catalog.`);
      const evaluated = Number(evaluatePredicate(field.predicate, entry));
      const lockedBit = P.matrix.rows[suspect.id][fieldIndex];
      if (evaluated !== lockedBit) throw new Error(`Suspect ${suspect.name}, ${planned.label}: assigned value evaluates ${evaluated ? 'true' : 'false'} but the locked row requires ${lockedBit ? 'true' : 'false'}.`);
      assignedKeys.push({ key, truth: lockedBit });
    });
    const minimumVariation = content.compatibilityMode === 'v2.2' || ['Boolean', 'Sex and Gender'].includes(field.valueType) ? 1 : 3;
    for (const truth of [0, 1]) if (new Set(assignedKeys.filter(item => item.truth === truth).map(item => item.key)).size < minimumVariation) throw new Error(`Field ${planned.label}: use at least ${minimumVariation} distinct printed value${minimumVariation === 1 ? '' : 's'} in the ${truth ? 'true' : 'false'} group.`);

    const guideRequired = field.predicate.operator === 'inSet' || field.valueType === 'Text category' || Number(P.matrix.cultureDepth) > 1;
    const guide = result.referenceGuides.find(item => item.fieldId === field.fieldId);
    if (guideRequired) {
      if (!guide || !Array.isArray(guide.rows)) throw new Error(`Field ${planned.label}: a complete student reference guide is required.`);
      for (const key of ['id', 'title', 'introduction']) requireText(guide[key], `Field ${planned.label} reference guide ${key}`);
      const covered = new Set();
      guide.rows.forEach((row, rowIndex) => {
        for (const key of ['valueKey', 'classification', 'explanation']) requireText(row?.[key], `Field ${planned.label} reference row ${rowIndex + 1} ${key}`);
        if (!keys.includes(row.valueKey) || covered.has(row.valueKey)) throw new Error(`Field ${planned.label}: reference rows must use each catalog key once.`);
        covered.add(row.valueKey);
        if (!row.explanation.trim() || !row.classification.trim()) throw new Error(`Field ${planned.label}: every reference row needs a student-facing explanation.`);
      });
      if (covered.size !== keys.length) throw new Error(`Field ${planned.label}: the reference guide must classify every printed value.`);
    }

    const activity = result.activities.find(item => P.activities.find(plan => plan.id === item.id)?.logic.attributeId === field.fieldId);
    if (!activity || normalizedClue(activity.extraction.exactClueText) !== normalizedClue(field.clue.decoderPayload)) throw new Error(`Field ${planned.label}: decoded payload does not match the selected clue.`);
  });
  if (Object.keys(content.assignments).length !== 32 || Object.keys(content.assignments).some(id => !P.candidates.suspects.some(item => item.id === id))) throw new Error('matrixContent.assignments must contain exactly the 32 locked suspect IDs.');
  const referencedGlossary = new Set(result.autotags.map(tag => tag.glossaryId));
  content.fields.forEach(field => field.valueCatalog.forEach(value => value.glossaryIds.forEach(id => referencedGlossary.add(id))));
  result.referenceGuides.forEach(guide => (guide.rows || []).forEach(row => (row.glossaryIds || []).forEach(id => {
    if (!glossaryIds.has(id)) throw new Error(`Reference guide ${guide.title || guide.id} links to a missing glossary entry.`);
    referencedGlossary.add(id);
  })));
  result.glossary.forEach(entry => { if (!entry.generalSupport && !referencedGlossary.has(entry.id)) throw new Error(`Glossary term ${entry.displayTerm || entry.term} is not referenced and is not marked as general support.`); });
  result.suspects.forEach(suspect => {
    if (Object.keys(suspect.attributes || {}).length) throw new Error(`${suspect.name}: attributes must stay empty in 32-Suspect Mystery; use matrixContent.assignments.`);
  });
}

function validateResultShapeBase(result) {
  if (!result || result.format !== RESULT_FORMAT || result.version !== VERSION) throw new Error('This is not a LogicForge v2.3.0 result.');
  if (result.projectId !== P.id) throw new Error('This result belongs to a different LogicForge project. Export a packet from this project.');
  if (result.revision !== P.revision) throw new Error(`This result was generated for design revision ${result.revision}; the open project is revision ${P.revision}. Export the current packet and regenerate.`);
  if (result.designFingerprint !== designFingerprint()) throw new Error(`The design fingerprint does not match. Expected ${designFingerprint()}; export the current packet and preserve its fingerprint.`);
  if (!result.case || typeof result.case !== 'object') throw new Error('Case content is missing.');
  for (const key of ['title', 'hook', 'incidentSubject', 'briefing', 'timeline', 'evidenceRule']) requireText(result.case[key], `case.${key}`);
  if (normalizeIncident(result.case.incidentSubject) !== normalizeIncident(P.incident)) throw new Error('The locked incident subject changed.');
  validateCaseVisual(result.case.visual);
  validateGeneratedCandidates(result.suspects, P.candidates.suspects, 'Suspect', P.gameMode === 'profile');
  validateGeneratedCandidates(result.locations, P.candidates.locations, 'Location');
  validateGeneratedCandidates(result.objects, P.candidates.objects, 'Object');
  if (!Array.isArray(result.activities) || result.activities.length !== P.activities.length || new Set(result.activities.map(activity => activity.id)).size !== P.activities.length) throw new Error('Activity count or IDs changed.');
  result.activities.forEach(generated => {
    const planned = P.activities.find(activity => activity.id === generated.id);
    if (!planned) throw new Error('An unknown activity ID was imported.');
    requireText(generated.title, `activities.${planned.id}.title`);
    requireText(generated.instructions, `activities.${planned.id}.instructions`);
    requireText(generated.evidenceNarrative, `activities.${planned.id}.evidenceNarrative`);
    if (!generated.skillSummary || typeof generated.skillSummary !== 'object' || Array.isArray(generated.skillSummary)) throw new Error(`Investigation ${planned.id}: skillSummary is missing.`);
    for (const key of ['selectionMode', 'grade', 'skillKey', 'skillLabel', 'ccssDomain', 'ccssStandard']) requireText(generated.skillSummary[key], `activities.${planned.id}.skillSummary.${key}`);
    const expectedMode = planned.autoMath ? 'autoDistinctCoreCCSS' : 'teacherSpecified';
    if (generated.skillSummary.selectionMode !== expectedMode) throw new Error(`Investigation ${planned.id}: skillSummary.selectionMode must be ${expectedMode}.`);
    if (planned.autoMath && generated.skillSummary.grade !== String(planned.autoMathGrade || planned.grade)) throw new Error(`Investigation ${planned.id}: auto-filled CCSS grade changed.`);
    if (!generated.skillSummary.skillKey.trim() || !generated.skillSummary.skillLabel.trim()) throw new Error(`Investigation ${planned.id}: skillSummary needs a normalized skillKey and skillLabel.`);
    const range = countRange(planned);
    if (!Number.isInteger(generated.actualResponseCount) || generated.actualResponseCount < range.min || generated.actualResponseCount > range.max) throw new Error(`Activity ${planned.id} response count is outside its allowed budget.`);
    if (!Array.isArray(generated.questions) || generated.questions.length !== generated.actualResponseCount) throw new Error(`Activity ${planned.id} question count does not equal actualResponseCount.`);
    generated.questions.forEach((question, index) => {
      if (question.id !== `${planned.id}-R${index + 1}`) throw new Error(`Activity ${planned.id} response IDs must be consecutive and stable.`);
      for (const key of ['prompt', 'answer', 'worked', 'checkExpression']) requireText(question[key], `Question ${key}`);
      if (!Array.isArray(question.figureIds) || question.figureIds.some(id => typeof id !== 'string')) throw new Error('Question figureIds must be an array of text IDs.');
      if (!question.table || !Array.isArray(question.table.headers) || !Array.isArray(question.table.rows) || question.table.headers.some(value => typeof value !== 'string') || question.table.rows.some(row => !Array.isArray(row) || row.length !== question.table.headers.length || row.some(value => typeof value !== 'string'))) throw new Error('Question tables must use matching text headers and rows.');
    });
    if (!Array.isArray(generated.figures)) throw new Error('Figures must be an array.');
    generated.figures.forEach(validateFigure);
    const extraction = generated.extraction;
    if (!extraction || typeof extraction !== 'object') throw new Error('Structured clue extraction is missing.');
    if (extraction.clueId !== planned.clueId || extraction.requiredFindingKey !== planned.logic.findingKey) throw new Error('A clue ID or required finding changed.');
    requireText(extraction.exactClueText, 'Exact clue text');
    if (!usesGeneratedClue(planned) && !approvedClues(planned.logic).includes(extraction.exactClueText)) throw new Error('The AI used clue wording that the teacher did not approve.');
    if (!['Alphabet Code', 'Answer Matching', 'Cross-Out'].includes(extraction.decoder)) throw new Error('Choose one supported decoder for every activity.');
    const configured = decoderSetting(planned);
    if (configured !== 'Auto-select a compatible method' && extraction.decoder !== configured) throw new Error(`Activity ${planned.id} changed its required decoder.`);
    requireText(extraction.readingOrder, 'Extraction reading order');
    for (const key of ['mapping', 'displayOrder', 'decoys', 'tiles']) if (!Array.isArray(extraction[key])) throw new Error(`Extraction ${key} must be an array.`);
  });
  const summaries = result.activities.map(activity => ({ planned: P.activities.find(item => item.id === activity.id), activity, key: activity.skillSummary.skillKey.trim().toLowerCase() }));
  summaries.forEach((item, index) => summaries.slice(index + 1).forEach(other => {
    if (item.key && item.key === other.key && (item.planned.autoMath || other.planned.autoMath)) throw new Error(`Investigations ${P.activities.indexOf(item.planned) + 1} and ${P.activities.indexOf(other.planned) + 1} both use ${item.activity.skillSummary.skillLabel}. Auto-filled investigation skills must be distinct.`);
  }));
  requireText(result.solutionExplanation, 'solutionExplanation');
  requireText(result.teachingNotes, 'teachingNotes');
  validateMatrixResult(result);
  return result;
}

function parseResultText(raw) {
  const cleaned = String(raw || '').replace(/^\uFEFF/, '').trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  try { return JSON.parse(cleaned); }
  catch { /* Try to recover one JSON object from short surrounding prose. */ }
  const marker = cleaned.indexOf(`"${RESULT_FORMAT}"`);
  if (marker < 0) throw new Error('No completed LogicForge result object was found. The AI may have returned instructions or a blank template instead.');
  const start = cleaned.lastIndexOf('{', marker);
  if (start < 0) throw new Error('The completed JSON object is malformed.');
  let depth = 0;
  let quoted = false;
  let escaped = false;
  for (let index = start; index < cleaned.length; index++) {
    const char = cleaned[index];
    if (quoted) {
      if (escaped) escaped = false;
      else if (char === '\\') escaped = true;
      else if (char === '"') quoted = false;
      continue;
    }
    if (char === '"') quoted = true;
    else if (char === '{') depth += 1;
    else if (char === '}') {
      depth -= 1;
      if (depth === 0) return JSON.parse(cleaned.slice(start, index + 1));
    }
  }
  throw new Error('The completed JSON object is incomplete.');
}

// Restricted arithmetic parser: no eval, identifiers, functions, or implicit multiplication.
function calculate(expression) {
  const unwrapped = String(expression).trim().replace(/^\[\[(?:eq|math):([\s\S]*)\]\]$/i, '$1');
  const source = unwrapped.replace(/\[\[(-?\d+)\/(-?\d+)\]\]/g, '($1/$2)').replaceAll('−', '-').replaceAll('×', '*').replaceAll('÷', '/').replace(/\s/g, '');
  if (!source || source.length > 500 || /[^0-9.+\-*/^()]/.test(source)) throw new Error('Unsupported expression');
  const tokens = source.match(/(?:\d+(?:\.\d*)?|\.\d+)|[()+\-*/^]/g) || [];
  let index = 0;
  function primary() {
    const token = tokens[index++];
    if (token === '(') {
      const value = add();
      if (tokens[index++] !== ')') throw new Error('Unmatched parenthesis');
      return value;
    }
    if (!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(token || '')) throw new Error('Expected number');
    return Number(token);
  }
  function power() { let value = primary(); if (tokens[index] === '^') { index += 1; value **= unary(); } return value; }
  function unary() { if (tokens[index] === '+') { index += 1; return unary(); } if (tokens[index] === '-') { index += 1; return -unary(); } return power(); }
  function multiply() { let value = unary(); while (tokens[index] === '*' || tokens[index] === '/') { const operator = tokens[index++]; const right = unary(); value = operator === '*' ? value * right : value / right; } return value; }
  function add() { let value = multiply(); while (tokens[index] === '+' || tokens[index] === '-') { const operator = tokens[index++]; const right = multiply(); value = operator === '+' ? value + right : value - right; } return value; }
  const value = add();
  if (index !== tokens.length || !Number.isFinite(value)) throw new Error('Invalid expression');
  return value;
}

function canonicalAnswer(answer) {
  try {
    const value = calculate(answer);
    return `number:${Number(value.toPrecision(13))}`;
  } catch {
    return `text:${String(answer || '').trim().toLowerCase().replace(/\s+/g, ' ')}`;
  }
}

function replayExtraction(planned, generated) {
  const issues = [];
  const extraction = generated.extraction;
  const questions = generated.questions;
  const target = normalizedClue(extraction.exactClueText);
  if (unsupportedClueCharacters(extraction.exactClueText) || !target) issues.push(issue('error', `${generated.title}: exact clue text contains unsupported characters or no letters.`));
  if (!compatiblePlan(planned, extraction.exactClueText, extraction.decoder) || !countAllowed(planned, generated.actualResponseCount)) issues.push(issue('error', `${generated.title}: the actual decoder, clue, and response count do not fit the teacher budget.`));
  let decoded = '';
  if (extraction.decoder === 'Alphabet Code') {
    if (extraction.mapping.length || extraction.displayOrder.length || extraction.decoys.length || extraction.tiles.length) issues.push(issue('error', `${generated.title}: Alphabet Code must not contain matching, decoy, or tile data.`));
    if (questions.length !== target.length) issues.push(issue('error', `${generated.title}: Alphabet Code requires one response per encoded letter.`));
    decoded = questions.map((question, index) => {
      try {
        const value = calculate(question.answer);
        if (!Number.isInteger(value) || value < 1 || value > 26) throw new Error();
        return String.fromCharCode(64 + value);
      } catch {
        issues.push(issue('error', `${generated.title}, response ${index + 1}: Alphabet Code answers must calculate to integers 1–26.`));
        return '?';
      }
    }).join('');
  } else if (extraction.decoder === 'Answer Matching') {
    if (extraction.tiles.length) issues.push(issue('error', `${generated.title}: Answer Matching must not contain cross-out tiles.`));
    if (extraction.mapping.length !== questions.length) issues.push(issue('error', `${generated.title}: Answer Matching needs one mapping entry per response.`));
    const expectedDecoys = Math.max(3, Math.ceil(questions.length / 2));
    if (extraction.decoys.length !== expectedDecoys) issues.push(issue('error', `${generated.title}: Answer Matching needs ${expectedDecoys} decoy key rows so the visible key does not reveal the clue.`));
    if (questions.length < Math.ceil(target.length / 3) || questions.length > target.length) issues.push(issue('error', `${generated.title}: the response count cannot partition the clue into one-to-three-letter matching fragments.`));
    const byResponse = new Map();
    const collisions = new Map();
    extraction.mapping.forEach((entry, index) => {
      if (!entry || typeof entry !== 'object') return issues.push(issue('error', `${generated.title}: mapping entry ${index + 1} is invalid.`));
      for (const key of ['responseId', 'answer', 'output']) if (typeof entry[key] !== 'string') issues.push(issue('error', `${generated.title}: mapping entry ${index + 1} ${key} must be text.`));
      if (byResponse.has(entry.responseId)) issues.push(issue('error', `${generated.title}: a response appears more than once in the matching key.`));
      byResponse.set(entry.responseId, entry);
      if (!/^[A-Z]{1,3}$/.test(entry.output || '')) issues.push(issue('error', `${generated.title}: matching outputs must contain one to three uppercase letters.`));
      const key = canonicalAnswer(entry.answer);
      if (collisions.has(key) && collisions.get(key) !== entry.output) issues.push(issue('error', `${generated.title}: equivalent answer ${entry.answer} maps to conflicting outputs.`));
      collisions.set(key, entry.output);
    });
    const decoyIds = new Set();
    extraction.decoys.forEach((entry, index) => {
      if (!entry || typeof entry !== 'object') return issues.push(issue('error', `${generated.title}: decoy entry ${index + 1} is invalid.`));
      for (const key of ['id', 'answer', 'output']) if (typeof entry[key] !== 'string') issues.push(issue('error', `${generated.title}: decoy entry ${index + 1} ${key} must be text.`));
      const expectedId = `${planned.id}-D${index + 1}`;
      if (entry.id !== expectedId) issues.push(issue('error', `${generated.title}: decoy IDs must stay consecutive and stable.`));
      if (decoyIds.has(entry.id)) issues.push(issue('error', `${generated.title}: decoy IDs must be unique.`));
      decoyIds.add(entry.id);
      if (!/^[A-Z]{1,3}$/.test(entry.output || '')) issues.push(issue('error', `${generated.title}: decoy outputs must contain one to three uppercase letters.`));
      const key = canonicalAnswer(entry.answer);
      if (collisions.has(key)) issues.push(issue('error', `${generated.title}: decoy answer ${entry.answer || '(blank)'} duplicates a correct answer.`));
      if (collisions.has(`decoy:${key}`)) issues.push(issue('error', `${generated.title}: decoy answers must be distinct.`));
      collisions.set(`decoy:${key}`, entry.output);
    });
    decoded = questions.map((question, index) => {
      const entry = byResponse.get(question.id);
      if (!entry) { issues.push(issue('error', `${generated.title}, response ${index + 1}: missing matching-key entry.`)); return '?'; }
      if (canonicalAnswer(entry.answer) !== canonicalAnswer(question.answer)) issues.push(issue('error', `${generated.title}, response ${index + 1}: matching-key answer disagrees with the answer key.`));
      return entry.output;
    }).join('');
    const expectedIds = [...questions.map(question => question.id), ...extraction.decoys.map(entry => entry.id)];
    if (extraction.displayOrder.length !== expectedIds.length || new Set(extraction.displayOrder).size !== expectedIds.length || extraction.displayOrder.some(id => !expectedIds.includes(id))) issues.push(issue('error', `${generated.title}: displayOrder must be a permutation of every response ID.`));
    if (expectedIds.length > 2 && extraction.displayOrder.every((id, index) => id === expectedIds[index])) issues.push(issue('error', `${generated.title}: the answer-matching table must be shuffled.`));
  } else if (extraction.decoder === 'Cross-Out') {
    if (extraction.mapping.length || extraction.displayOrder.length || extraction.decoys.length) issues.push(issue('error', `${generated.title}: Cross-Out must not contain matching or decoy data.`));
    const answerKeys = questions.map(question => canonicalAnswer(question.answer));
    if (new Set(answerKeys).size !== answerKeys.length) issues.push(issue('error', `${generated.title}: Cross-Out requires distinct correct answers so each answer selects exactly one tile.`));
    if (extraction.readingOrder !== 'left-to-right') issues.push(issue('error', `${generated.title}: v2 Cross-Out supports only left-to-right reading order.`));
    if (extraction.tiles.length !== questions.length + target.length || extraction.tiles.length > 40) issues.push(issue('error', `${generated.title}: Cross-Out tile count must equal responses plus clue letters and cannot exceed 40.`));
    const tileIds = new Set();
    const removedResponses = new Map();
    const survivors = [];
    extraction.tiles.forEach((tile, index) => {
      if (!tile || typeof tile !== 'object') return issues.push(issue('error', `${generated.title}: tile ${index + 1} is invalid.`));
      for (const key of ['id', 'answer', 'letter', 'removeByResponseId']) if (typeof tile[key] !== 'string') issues.push(issue('error', `${generated.title}: tile ${index + 1} ${key} must be text.`));
      if (tileIds.has(tile.id)) issues.push(issue('error', `${generated.title}: tile IDs must be unique.`));
      tileIds.add(tile.id);
      if (!/^[A-Z]$/.test(tile.letter || '')) issues.push(issue('error', `${generated.title}: every tile must contain one uppercase letter.`));
      if (tile.removeByResponseId) {
        const question = questions.find(item => item.id === tile.removeByResponseId);
        if (!question) issues.push(issue('error', `${generated.title}: a tile references an unknown response.`));
        else if (canonicalAnswer(tile.answer) !== canonicalAnswer(question.answer)) issues.push(issue('error', `${generated.title}: a removable tile answer disagrees with its response.`));
        removedResponses.set(tile.removeByResponseId, (removedResponses.get(tile.removeByResponseId) || 0) + 1);
      } else {
        if (answerKeys.includes(canonicalAnswer(tile.answer))) issues.push(issue('error', `${generated.title}: a surviving clue tile matches a correct answer and would be removed.`));
        survivors.push(tile.letter);
      }
    });
    questions.forEach(question => { if (removedResponses.get(question.id) !== 1) issues.push(issue('error', `${generated.title}: every response must remove exactly one tile.`)); });
    decoded = survivors.join('');
  }
  if (decoded !== target) issues.push(issue('error', `${generated.title}: decoder replay produced “${decoded}” instead of “${target}”.`));
  return { decoded, target, issues };
}

function profileEvidenceQA(result) {
  if (P.gameMode !== 'profile') return [];
  const issues = [];
  const culpritId = P.solution.suspectId;
  const targets = P.activities.map(activity => ({ attribute: findAttribute(activity.logic.attributeId), activity }));
  if (targets.some(target => !target.attribute)) return [issue('error', 'A Build the Profile clue references a missing profile attribute.')];
  const valueEqual = (left, right) => String(left || '').trim().toLowerCase() === String(right || '').trim().toLowerCase();
  const matches = activeTargets => result.suspects.filter(suspect => activeTargets.every(target => valueEqual(suspect.attributes[target.attribute.id], target.attribute.value)));
  targets.forEach((target, index) => {
    if (!target.attribute) return;
    const single = matches([target]);
    if (!single.some(suspect => suspect.id === culpritId)) issues.push(issue('error', `Investigation ${index + 1}: the selected suspect does not have the required ${target.attribute.label} value.`));
    if (single.length === 1) issues.push(issue('error', `Investigation ${index + 1}: this single characteristic identifies the responsible person immediately.`));
  });
  const complete = matches(targets);
  if (complete.length !== 1 || complete[0]?.id !== culpritId) issues.push(issue('error', 'The complete profile does not identify exactly the selected suspect.'));
  targets.forEach((_, omitIndex) => {
    const without = matches(targets.filter((__, index) => index !== omitIndex));
    if (without.length === 1 && without[0]?.id === culpritId) issues.push(issue('error', `Investigation ${omitIndex + 1} is not necessary; the complete profile remains unique without it.`));
  });
  return issues;
}

function normalizedWords(value) {
  return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
}

function narrativeEvidenceQA(planned, generated) {
  if (planned.logic.cluePolicy !== 'AI narrative evidence') return [];
  const issues = [];
  const clue = normalizedWords(generated.extraction.exactClueText);
  const paddedClue = ` ${clue} `;
  for (const candidate of allCandidateOptions()) {
    const displayName = candidateDisplayName(candidate.id);
    const name = normalizedWords(displayName);
    if (name && paddedClue.includes(` ${name} `)) issues.push(issue('error', `${generated.title}: the decoded evidence directly contains candidate name “${displayName}”. Use a narrative fact students must connect to the dossier.`));
  }
  if (/\b(?:SUSPECT|CULPRIT|LOCATION|OBJECT)\s*[A-Z]?\b/.test(clue)) issues.push(issue('error', `${generated.title}: the decoded evidence uses a generic candidate label instead of a narrative fact.`));
  const target = findCandidate(planned.logic.candidateId);
  if (target && !normalizedWords(generated.evidenceNarrative).includes(normalizedWords(candidateDisplayName(target.id)))) issues.push(issue('error', `${generated.title}: the teacher evidence explanation must name ${candidateDisplayName(target.id)} and explain why the decoded fact rules that candidate out.`));
  return issues;
}

function mathMarkupIssues(value, label) {
  const issues = [];
  const source = String(value || '');
  const starts = (source.match(/\[\[(?:eq|math):/gi) || []).length;
  const valid = [...source.matchAll(/\[\[(?:eq|math):([\s\S]*?)\]\]/gi)];
  if (starts !== valid.length) return [issue('error', `${label}: a [[eq:...]] mathematics marker is not closed.`)];
  for (const match of valid) {
    try { if(/\b(?:alphabet|decode|code)\b/i.test(source)&&/^[A-Z]\s*=\s*\d+$/i.test(match[1].trim()))throw Error('Alphabet key');equationMathML(match[1]); }
    catch { issues.push(issue('error', `${label}: “${match[1]}” is not valid LogicForge equation notation.`)); }
  }
  const prose = source.replace(/\[\[(?:eq|math):[\s\S]*?\]\]/gi, '').replace(/\[\[-?\d+\/-?\d+\]\]/g, '').replace(/\b\d{1,2}:\d{2}\s*=\s*\d+\b/g,'time conversion');
  const bareMath = /√|(?:\w|\))\s*\^\s*(?:\w|\()|\s\*\s|(?:\d|\))\s*(?:\+|×|÷|=|\/)\s*(?:-?\d|\w|\()|\b[A-Za-z]\b\s*=\s*(?:-?\d|[A-Za-z]|\()/;
  if (bareMath.test(prose)) issues.push(issue('error', `${label}: visible mathematics must be wrapped in [[eq:...]] so it typesets unambiguously.`));
  return issues;
}

function figurePresentationQA(figure, activityNumber) {
  const issues = [];
  if (figure.labels.some(label => /°|\b\d+(?:\.\d+)?\s*(?:CM|MM|KM|M|IN|FT)\b/i.test(label.text))) issues.push(issue('error', `Investigation ${activityNumber}, figure ${figure.id}: move angle and dimension values out of the drawing and into measurements.`));
  return issues;
}

function generatedQABase() {
  const issues = designQA().filter(item => item.level !== 'ok');
  if (!P.generated) return [...issues, issue('error', 'Import generated content before publication.')];
  let result;
  try { result = validateResultShape(P.generated); }
  catch (error) { return [...issues, issue('error', error.message)]; }
  for (const key of ['title', 'hook', 'briefing', 'evidenceRule']) if (!result.case[key].trim()) issues.push(issue('error', `Complete the case ${key}.`));
  for (const key of ['hook', 'briefing', 'timeline', 'evidenceRule']) issues.push(...mathMarkupIssues(result.case[key], `Case ${key}`));
  if (!result.case.visual.alt.trim() || !result.case.visual.caption.trim() || result.case.visual.shapes.length < 8 || result.case.visual.shapes.length > 60) issues.push(issue('error', 'Complete the Case Briefing illustration with alt text, a caption, and 8–60 structured shapes.'));
  const visualText = normalizedWords([result.case.visual.alt, result.case.visual.caption, ...result.case.visual.labels.map(label => label.text)].join(' '));
  for (const candidate of allCandidateOptions()) {
    const name = normalizedWords(candidateDisplayName(candidate.id));
    if (name && ` ${visualText} `.includes(` ${name} `)) issues.push(issue('error', `The Case Briefing illustration names ${candidateDisplayName(candidate.id)}; keep the image solution-neutral.`));
  }
  if (!result.solutionExplanation.trim()) issues.push(issue('error', 'Complete the final solution explanation.'));
  result.suspects.forEach(suspect => {
    if (P.gameMode !== 'matrix' && (!suspect.description.trim() || !suspect.statement.trim() || !suspect.accessAlibi.trim())) issues.push(issue('error', `Complete the dossier for ${suspect.name}.`));
    for (const key of ['description', 'statement', 'accessAlibi']) issues.push(...mathMarkupIssues(suspect[key], `${suspect.name} ${key}`));
  });
  result.locations.forEach(location => {
    if (!location.description.trim()) issues.push(issue('error', `Complete the description for ${location.name}.`));
    issues.push(...mathMarkupIssues(location.description, `${location.name} description`));
  });
  result.objects.forEach(object => {
    if (!object.description.trim()) issues.push(issue('error', `Complete the description for ${object.name}.`));
    issues.push(...mathMarkupIssues(object.description, `${object.name} description`));
  });
  const allFigureIds = result.activities.flatMap(activity => activity.figures.map(figure => figure.id));
  if (new Set(allFigureIds).size !== allFigureIds.length) issues.push(issue('error', 'Figure IDs must be unique across the project.'));
  let manualMath = 0;
  result.activities.forEach((generated, index) => {
    const planned = P.activities.find(activity => activity.id === generated.id);
    if (!generated.title.trim() || !generated.instructions.trim() || !generated.evidenceNarrative.trim()) issues.push(issue('error', `Investigation ${index + 1}: complete the title, instructions, and evidence narrative.`));
    issues.push(...mathMarkupIssues(generated.instructions, `Investigation ${index + 1} instructions`));
    issues.push(...mathMarkupIssues(generated.evidenceNarrative, `Investigation ${index + 1} evidence explanation`));
    if (planned.figures.trim().toLowerCase() !== 'none' && planned.figures.trim() && !generated.figures.length) issues.push(issue('error', `Investigation ${index + 1}: a required figure is missing.`));
    generated.questions.forEach((question, questionIndex) => {
      if (!question.prompt.trim() || !question.answer.trim() || !question.worked.trim()) issues.push(issue('error', `Investigation ${index + 1}, response ${questionIndex + 1}: question, answer, and worked solution are required.`));
      issues.push(...mathMarkupIssues(question.prompt, `Investigation ${index + 1}, response ${questionIndex + 1} prompt`));
      issues.push(...mathMarkupIssues(question.worked, `Investigation ${index + 1}, response ${questionIndex + 1} worked solution`));
      question.table.headers.forEach((cell, cellIndex) => issues.push(...mathMarkupIssues(cell, `Investigation ${index + 1}, response ${questionIndex + 1}, table header ${cellIndex + 1}`)));
      question.table.rows.forEach((row, rowIndex) => row.forEach((cell, cellIndex) => issues.push(...mathMarkupIssues(cell, `Investigation ${index + 1}, response ${questionIndex + 1}, table row ${rowIndex + 1} cell ${cellIndex + 1}`))));
      if (question.figureIds.some(id => !generated.figures.some(figure => figure.id === id))) issues.push(issue('error', `Investigation ${index + 1}, response ${questionIndex + 1}: a referenced figure is missing.`));
      if (question.checkExpression.trim()) {
        try {
          const checked = calculate(question.checkExpression);
          const answer = calculate(question.answer);
          if (Math.abs(checked - answer) > 1e-9 * Math.max(1, Math.abs(checked), Math.abs(answer))) issues.push(issue('error', `Investigation ${index + 1}, response ${questionIndex + 1}: arithmetic check disagrees with the answer key.`));
        } catch { manualMath += 1; }
      } else manualMath += 1;
    });
    if (generated.figures.some(figure => !generated.questions.some(question => question.figureIds.includes(figure.id)))) issues.push(issue('warn', `Investigation ${index + 1}: an unreferenced figure will not print.`));
    generated.figures.forEach(figure => {
      issues.push(...figurePresentationQA(figure, index + 1));
      figure.measurements.forEach((item, measurementIndex) => issues.push(...mathMarkupIssues(item.value, `Investigation ${index + 1}, figure ${figure.id}, measurement ${measurementIndex + 1}`)));
    });
    issues.push(...narrativeEvidenceQA(planned, generated));
    issues.push(...replayExtraction(planned, generated).issues);
  });
  if(P.naming && P.naming.mode!=='Keep current names') {
    const narrative=[...Object.values(result.case).filter(v=>typeof v==='string'),result.solutionExplanation,result.teachingNotes,...result.activities.flatMap(a=>[a.instructions,a.evidenceNarrative]),...result.suspects.flatMap(a=>[a.description,a.statement,a.accessAlibi])].join('\n');
    for(const old of P.candidates.suspects){const current=result.suspects.find(x=>x.id===old.id);if(current&&current.name!==old.name&&!result.suspects.some(x=>x.name===old.name)){const escaped=old.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(new RegExp('(^|[^\\p{L}])'+escaped+'([^\\p{L}]|$)','u').test(narrative))issues.push(issue('error',`Narrative still uses replaced suspect name ${old.name}. Use ${current.name} consistently.`));}}
  }
  const clueKeys = result.activities.map(activity => normalizedClue(activity.extraction.exactClueText));
  if (new Set(clueKeys).size !== clueKeys.length) issues.push(issue('error', 'Every investigation needs a distinct decoded clue so students cannot exploit a repeated pattern.'));
  issues.push(...profileEvidenceQA(result));
  if (P.gameMode === 'matrix') {
    result.glossary.forEach(entry => {
      for (const key of ['meaning', 'clueRelevantFact', 'example']) issues.push(...mathMarkupIssues(entry[key], `${entry.displayTerm || entry.term} glossary ${key}`));
      const words = ` ${normalizedWords([entry.meaning, entry.clueRelevantFact, entry.example].join(' '))} `;
      if (result.suspects.some(suspect => words.includes(` ${normalizedWords(suspect.name)} `))) issues.push(issue('error', `${entry.displayTerm || entry.term}: glossary entries must not name any suspect or disclose the solution.`));
    });
    if (Number(P.matrix.cultureDepth) > 1) issues.push(issue('warn', `Review cultural classifications for ${P.matrix.cultureFocus}. Confirm that the printed reference facts justify every clue classification.`));
  }
  issues.push(...mathMarkupIssues(result.solutionExplanation, 'Complete solution explanation'));
  issues.push(...mathMarkupIssues(result.teachingNotes, 'Teaching notes'));
  if (manualMath) issues.push(issue('warn', `${manualMath} mathematical response${manualMath === 1 ? '' : 's'} require explicit teacher verification because automatic arithmetic checking is unsupported or intentionally blank.`));
  issues.push(issue('warn', 'Teacher review remains required for mathematical construct alignment, figure accuracy, clue plausibility, narrative implications, answer leakage, and printed-page layout.'));
  if (!issues.some(item => item.level === 'error')) issues.unshift(issue('ok', 'The structured chain—question → answer → decoded clue → required finding → final solution—passes all supported checks.'));
  return issues;
}
