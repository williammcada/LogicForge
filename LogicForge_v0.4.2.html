function equationTokens(source) {
  const text = String(source || '').trim();
  if (!text || text.length > 500) throw new Error('Invalid equation');
  const tokens = [];
  let index = 0;
  while (index < text.length) {
    const rest = text.slice(index);
    const space = rest.match(/^\s+/);
    if (space) { index += space[0].length; continue; }
    const number = rest.match(/^(?:\d+(?:\.\d*)?|\.\d+)/);
    if (number) { tokens.push({ type: 'number', value: number[0] }); index += number[0].length; continue; }
    const identifier = rest.match(/^[A-Za-z\u0370-\u03FF]+/);
    if (identifier) { tokens.push({ type: 'identifier', value: identifier[0] }); index += identifier[0].length; continue; }
    const pair = ['<=', '>=', '!=', '≈=', '->'].find(operator => rest.startsWith(operator));
    if (pair) { tokens.push({ type: 'operator', value: pair }); index += pair.length; continue; }
    const char = text[index];
    if ('+-*/^_=<>()[]{}.,:|%°√×÷·≤≥≠≈±∞∠'.includes(char)) { tokens.push({ type: 'operator', value: char }); index += 1; continue; }
    throw new Error('Unsupported equation token');
  }
  return tokens;
}

function equationMathML(source) {
  validateEquationGrammar(source);
  const tokens = equationTokens(source);
  let index = 0;
  const peek = () => tokens[index];
  const take = () => tokens[index++];
  const op = value => `<mo>${esc(value)}</mo>`;
  const row = parts => `<mrow>${parts.join('')}</mrow>`;
  const operatorText = value => ({ '*': '×', '·': '·', '×': '×', '÷': '÷', '<=': '≤', '>=': '≥', '!=': '≠', '≈=': '≈', '->': '→' }[value] || value);
  const startsPrimary = token => token && (token.type === 'number' || token.type === 'identifier' || ['(', '[', '{', '√', '∞', '∠'].includes(token.value));

  function primary() {
    const token = take();
    if (!token) throw new Error('Expected expression');
    if (['(', '[', '{'].includes(token.value)) {
      const close = token.value === '(' ? ')' : token.value === '[' ? ']' : '}';
      const inside = relation();
      if (take()?.value !== close) throw new Error('Unmatched grouping');
      return row([op(token.value), inside, op(close)]);
    }
    if (token.value === '√' || (token.type === 'identifier' && token.value.toLowerCase() === 'sqrt')) {
      let inside;
      if (peek()?.value === '(') {
        take();
        inside = relation();
        if (take()?.value !== ')') throw new Error('Unmatched radical');
      } else inside = primary();
      return `<msqrt>${inside}</msqrt>`;
    }
    if (token.type === 'identifier' && token.value.toLowerCase() === 'abs') {
      if (take()?.value !== '(') throw new Error('Absolute value needs parentheses');
      const inside = relation();
      if (take()?.value !== ')') throw new Error('Unmatched absolute value');
      return row([op('|'), inside, op('|')]);
    }
    if (token.type === 'number') return `<mn>${esc(token.value)}</mn>`;
    if (token.value === '∞') return '<mi>∞</mi>';
    if (token.value === '∠') return '<mo>∠</mo>';
    if (token.type === 'identifier') {
      const lowered = token.value.toLowerCase();
      if (lowered === 'pi') return '<mi>π</mi>';
      return token.value.length > 1 ? `<mi mathvariant="normal">${esc(token.value)}</mi>` : `<mi>${esc(token.value)}</mi>`;
    }
    throw new Error('Expected equation value');
  }

  function scriptArgument() {
    if (peek()?.value === '-') { take(); return row([op('−'), primary()]); }
    return primary();
  }

  function scripted() {
    let base = primary();
    let subscript = '';
    let superscript = '';
    while (peek()?.value === '^' || peek()?.value === '_') {
      const marker = take().value;
      const value = scriptArgument();
      if (marker === '^') superscript = value;
      else subscript = value;
    }
    if (subscript && superscript) base = `<msubsup>${base}${subscript}${superscript}</msubsup>`;
    else if (subscript) base = `<msub>${base}${subscript}</msub>`;
    else if (superscript) base = `<msup>${base}${superscript}</msup>`;
    while (peek()?.value === '°' || peek()?.value === '%') base = row([base, op(take().value)]);
    return base;
  }

  function unary() {
    if (peek()?.value === '+' || peek()?.value === '-' || peek()?.value === '±') {
      const operator = take().value;
      return row([op(operator === '-' ? '−' : operator), unary()]);
    }
    return scripted();
  }

  function multiply() {
    let left = unary();
    while (true) {
      const token = peek();
      if (token && ['*', '×', '·', '÷', '/'].includes(token.value)) {
        take();
        const right = unary();
        left = token.value === '/' ? `<mfrac>${left}${right}</mfrac>` : row([left, op(operatorText(token.value)), right]);
      } else if (startsPrimary(token)) {
        left = row([left, '<mo>&#x2062;</mo>', unary()]);
      } else break;
    }
    return left;
  }

  function add() {
    let left = multiply();
    while (peek() && ['+', '-'].includes(peek().value)) {
      const operator = take().value;
      left = row([left, op(operator === '-' ? '−' : '+'), multiply()]);
    }
    return left;
  }

  function relation() {
    let left = add();
    while (peek() && ['=', '<', '>', '<=', '>=', '!=', '≈=', '->', '≤', '≥', '≠', '≈', ',', ':'].includes(peek().value)) {
      const operator = take().value;
      left = row([left, op(operatorText(operator)), add()]);
    }
    return left;
  }

  const body = relation();
  if (index !== tokens.length) throw new Error('Unexpected equation token');
  return `<math class="math-expression" xmlns="http://www.w3.org/1998/Math/MathML" aria-label="${esc(source)}">${body}</math>`;
}

function mathText(value, forceMath = false) {
  const source = publicProse(String(value ?? ''));
  const marker = /\[\[(?:eq|math):([\s\S]*?)\]\]|\[\[(-?\d+)\/(-?\d+)\]\]/gi;
  let output = '';
  let last = 0;
  let match;
  let found = false;
  while ((match = marker.exec(source))) {
    found = true;
    output += esc(source.slice(last, match.index));
    try { output += equationMathML(match[1] ?? `${match[2]}/${match[3]}`); }
    catch { output += `<span class="math-fallback">${esc(match[1] ?? `${match[2]}/${match[3]}`)}</span>`; }
    last = marker.lastIndex;
  }
  if (found) return output + esc(source.slice(last));
  if (forceMath && source.trim()) {
    try { return equationMathML(source); }
    catch { /* Text answers remain readable. */ }
  }
  return esc(source);
}

function renderTable(table) {
  if (!table?.headers?.length) return '';
  return `<table><thead><tr>${table.headers.map(header => `<th>${mathText(header)}</th>`).join('')}</tr></thead><tbody>${table.rows.map(row => `<tr>${row.map(cell => `<td>${mathText(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function renderCaseVisual(visual) {
  if (!visual) return '';
  const shapeMarkup = visual.shapes.map(shape => {
    const common = `stroke="${esc(shape.stroke)}" stroke-width="${shape.strokeWidth}"`;
    if (shape.type === 'rect') return `<rect x="${shape.x}" y="${shape.y}" width="${shape.width}" height="${shape.height}" rx="${shape.rx}" fill="${esc(shape.fill)}" ${common}/>`;
    if (shape.type === 'circle') return `<circle cx="${shape.cx}" cy="${shape.cy}" r="${shape.r}" fill="${esc(shape.fill)}" ${common}/>`;
    if (shape.type === 'line') return `<line x1="${shape.x1}" y1="${shape.y1}" x2="${shape.x2}" y2="${shape.y2}" ${common}/>`;
    return `<polygon points="${shape.points.map(point => point.join(',')).join(' ')}" fill="${esc(shape.fill)}" ${common}/>`;
  }).join('');
  const labels = visual.labels.map(label => `<text x="${label.x}" y="${label.y}" text-anchor="${label.anchor}" fill="${esc(label.fill)}" font-family="system-ui, sans-serif" font-size="${label.size}" font-weight="700">${esc(label.text)}</text>`).join('');
  return `<figure class="case-visual"><svg viewBox="0 0 ${visual.width} ${visual.height}" role="img" aria-label="${esc(visual.alt)}"><rect width="100%" height="100%" fill="${esc(visual.background)}"/>${shapeMarkup}${labels}</svg><figcaption>${mathText(visual.caption)}</figcaption></figure>`;
}

function renderFigure(figure) {
  if (!figure) return '';
  const padding = 18;
  const labels = figure.labels.map(label => `<text class="figure-label" x="${label.x}" y="${label.y}" text-anchor="${label.anchor || 'middle'}" dominant-baseline="middle">${esc(label.text)}</text>`).join('');
  const measurements = figure.measurements.length ? `<table class="measurement-table"><thead><tr><th>Figure label</th><th>Given measure</th></tr></thead><tbody>${figure.measurements.map(item => `<tr><td>${esc(item.label)}</td><td>${mathText(item.value)}</td></tr>`).join('')}</tbody></table>` : '';
  return `<figure class="math-figure"><svg viewBox="${-padding} ${-padding} ${figure.width + padding * 2} ${figure.height + padding * 2}" width="${Math.min(figure.width + padding * 2, 560)}" role="img" aria-label="${esc(figure.caption)}">${figure.lines.map(line => `<line x1="${line.x1}" y1="${line.y1}" x2="${line.x2}" y2="${line.y2}" stroke="black" stroke-width="1.5"/>`).join('')}${figure.circles.map(circle => `<circle cx="${circle.cx}" cy="${circle.cy}" r="${circle.r}" fill="none" stroke="black" stroke-width="1.5"/>`).join('')}${labels}</svg><figcaption>${esc(figure.caption)}</figcaption>${measurements}</figure>`;
}

function clueMask(value) {
  return String(value).split('').map(char => /[A-Za-z]/.test(char) ? '_' : esc(char)).join(' ');
}

function responseRecordingStrip(activity) {
  return `<div class="response-strip" aria-label="Finding fragments in question order">${activity.questions.map((question, index) => `<div class="response-box"><span>${index + 1}</span><b aria-hidden="true">&nbsp;</b></div>`).join('')}</div>`;
}

function renderDecoderPanel(activity) {
  const extraction = activity.extraction;
  if (extraction.decoder === 'Alphabet Code') {
    return `<div class="decoder-panel"><h3>Decode the finding · Alphabet Code</h3><p>Convert answer 1 to letter 1, answer 2 to letter 2, and continue in question order using the shared Alphabet Code reference sheet (A corresponds to 1; Z corresponds to 26).</p>${responseRecordingStrip(activity)}<p class="clue-mask">${clueMask(extraction.exactClueText)}</p></div>`;
  }
  if (extraction.decoder === 'Answer Matching') {
    const entries = extraction.displayOrder.map(id => extraction.mapping.find(entry => entry.responseId === id) || extraction.decoys.find(entry => entry.id === id)).filter(Boolean);
    return `<div class="decoder-panel"><h3>Decode the finding · Answer Matching</h3><ol class="decoder-steps"><li>Solve each numbered question.</li><li>Find that answer in the shuffled key. Some rows are decoys.</li><li>Copy its clue fragment into the box with the same question number. Read the boxes from left to right—no anagramming.</li></ol><table><thead><tr><th>Mathematical answer</th><th>Clue fragment</th></tr></thead><tbody>${entries.map(entry => `<tr><td>${mathText(entry.answer, true)}</td><td>${esc(entry.output)}</td></tr>`).join('')}</tbody></table>${responseRecordingStrip(activity)}<p class="clue-mask">${clueMask(extraction.exactClueText)}</p></div>`;
  }
  return `<div class="decoder-panel"><h3>Decode the finding · Cross-Out</h3><p>Cross out the one tile matching each final answer. Read surviving letters left-to-right, then top-to-bottom.</p><div class="crossout-grid" style="--tile-columns:${crossoutColumns(extraction.tiles)}">${extraction.tiles.map(tile => `<div class="crossout-tile"><span>${crossoutAnswer(tile.answer)}</span><br><b style="font-size:1.25rem">${esc(tile.letter)}</b></div>`).join('')}</div><p class="clue-mask">${clueMask(extraction.exactClueText)}</p></div>`;
}

function printFooter(kind, index, total) {
  return `<div class="printfoot">${esc(BRAND)} · LogicForge v${APP_VERSION} · ${esc(kind)} section ${index}/${total}</div>`;
}

function studentCandidatePages(result) {
  let content = '<h2>Candidate dossier</h2><p>Use these facts with the decoded evidence. Cross out cleared candidates on your tracker.</p>';
  content += orderedCandidates('suspects', result).map(suspect => `<div class="question"><h3>${esc(suspect.name)} · ${esc(suspect.role)}</h3><p>${mathText(suspect.description)}</p><p><b>Statement:</b> ${mathText(suspect.statement)}</p><p>${mathText(suspect.accessAlibi)}</p></div>`).join('');
  for (const category of ['locations', 'objects']) {
    if (result[category].length) content += `<h2>${candidateCategoryLabel(category)}</h2>${orderedCandidates(category, result).map(candidate => `<div class="question"><h3>${esc(candidate.name)}</h3><p>${mathText(candidate.description)}</p></div>`).join('')}`;
  }
  return content;
}

function comparisonTable(result, suspects, matrix = false) {
  const properties = matrix ? matrixFields() : P.profileAttributes;
  return `<table class="elimination-table comparison-table ${matrix ? 'matrix-table' : ''}"><thead><tr><th class="mark-column">Out?</th><th class="name-column">Suspect</th>${properties.map(property => `<th>${esc(property.label)}</th>`).join('')}</tr></thead><tbody>${suspects.map(suspect => `<tr><td class="mark-column"><span class="cross-box" aria-label="Mark when ruled out"></span></td><td><b>${esc(suspect.name)}</b></td>${properties.map(property => `<td>${matrix ? matrixCellHtml(suspect.id, property.id, result) : mathText(suspect.attributes[property.id])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function glossaryMarker(id, result) {
  const index = result.glossary.findIndex(item => item.id === id);
  return index < 0 ? '' : `<span class="marker" aria-label="Glossary ${index + 1}">${index + 1}</span>`;
}

function matrixCellHtml(suspectId, fieldId, result) {
  const assignment = result.matrixContent.assignments[suspectId]?.[fieldId];
  const entry = result.matrixContent.fields.find(item => item.fieldId === fieldId)?.valueCatalog.find(item => item.key === assignment);
  return entry ? `${esc(entry.display)}${(entry.glossaryIds || []).map(id => glossaryMarker(id, result)).join('')}` : '—';
}

function eliminationList(result, category) {
  return `<h3>${candidateCategoryLabel(category)}</h3><table class="elimination-table"><thead><tr><th class="mark-column">Out?</th><th>Candidate</th></tr></thead><tbody>${orderedCandidates(category, result).map(candidate => `<tr><td class="mark-column"><span class="cross-box" aria-label="Mark when ruled out"></span></td><td>${esc(candidate.name)}</td></tr>`).join('')}</tbody></table>`;
}

function trackerPages(result) {
  const instruction = '<p class="tracker-instruction"><b>Cross out a row or mark its box when a candidate is ruled out.</b> Leave possible candidates unmarked. Everything you need to compare is already printed.</p>';
  const conclusion = P.gameMode === 'complete' ? '<div class="final-choice"><b>Complete case:</b><p>Person: ___________________________________</p><p>Location: _________________________________</p><p>Object: ___________________________________</p></div>' : '<p class="final-choice"><b>Responsible person:</b> ______________________________</p>';
  if (P.gameMode === 'matrix') {
    const suspects = orderedCandidates('suspects', result);
    return [0, 1].map(page => `<h2>Suspect comparison tracker · ${page + 1} of 2</h2>${instruction}<p class="tracker-caption">Keep both tables together. Each clue halves the possibilities across all 32 rows: 32 → 16 → 8 → 4 → 2 → 1.</p>${comparisonTable(result, suspects.slice(page * 16, page * 16 + 16), true)}${page === 1 ? conclusion : '<p class="tracker-caption">The other 16 suspects are on the next tracker page.</p>'}`);
  }
  const body = P.gameMode === 'profile' ? `<h3>Suspect comparison table</h3><p class="tracker-caption">Every decoded characteristic belongs to the responsible person. Rule out a row as soon as any value fails to match.</p>${comparisonTable(result, orderedCandidates('suspects', result))}` : (P.gameMode === 'complete' ? ['suspects', 'locations', 'objects'] : ['suspects']).map(category => eliminationList(result, category)).join('');
  return [`<h2>Evidence tracker</h2>${instruction}${P.gameMode === 'complete' ? '<p class="tracker-caption">Compare the evidence with the dossier. Clear candidates in the relevant list until one person, one location, and one object remain.</p>' : ''}${body}${conclusion}`];
}

function vocabularyPages(result) {
  if (P.gameMode !== 'matrix') return [];
  const depthNames = { 1: 'Neutral', 2: 'Familiar', 3: 'Deep Dive' };
  const glossary = `<h2>ELL glossary</h2><p class="tracker-caption">Numbered markers in the comparison table point here. These definitions explain language; they do not reveal which suspect remains.</p><div class="vocabulary-grid">${result.glossary.map((entry, index) => `<div class="vocabulary-entry"><h3><span class="marker">${index + 1}</span> ${esc(entry.displayTerm || entry.term)}</h3><p>${esc(entry.meaning)}</p><p class="vocabulary-context">${esc(entry.clueRelevantFact)}</p><p class="vocabulary-example">${esc(entry.example)}</p></div>`).join('')}</div>`;
  const guides = result.referenceGuides.map(guide => {
    const field = result.matrixContent.fields.find(item => item.fieldId === guide.fieldId);
    return `<div class="reference-card"><h3>${esc(guide.title || field?.label || 'Reference guide')}</h3><p>${esc(guide.introduction)}</p><table><thead><tr><th>Table value</th><th>Classification</th><th>What students need to know</th></tr></thead><tbody>${guide.rows.map(row => { const value = field?.valueCatalog.find(item => item.key === row.valueKey); return `<tr><td>${esc(value?.display || row.valueKey)}${(value?.glossaryIds || []).map(id => glossaryMarker(id, result)).join('')}</td><td>${esc(row.classification)}</td><td>${esc(row.explanation)}</td></tr>`; }).join('')}</tbody></table></div>`;
  }).join('');
  return [`<h2>Culture and clue reference</h2><p class="tracker-caption">Region: ${esc(P.matrix.cultureFocus)} · Cultural depth ${P.matrix.cultureDepth} (${depthNames[P.matrix.cultureDepth]}). Use these tables to apply each clue without outside research.</p>${guides}`, glossary];
}

function renderMatrixReview(result) {
  return `<section class="card"><h3>32-suspect comparison table</h3><p class="muted">Visible values are varied; the teacher-only previews below show how one predicate classifies each field. Editing the structured content requires using the advanced editor and clears review confirmation.</p>${comparisonTable(result, orderedCandidates('suspects', result), true)}</section>${matrixFields().map((planned, fieldIndex) => {
    const fieldData = result.matrixContent.fields.find(item => item.fieldId === planned.id);
    const trueNames = orderedCandidates('suspects', result).filter(item => P.matrix.rows[item.id][fieldIndex] === 1).map(item => item.name);
    const falseNames = orderedCandidates('suspects', result).filter(item => P.matrix.rows[item.id][fieldIndex] === 0).map(item => item.name);
    const selectedText = fieldData.clue.selectedPolarity === 'positive' ? fieldData.clue.positiveText : fieldData.clue.negativeText;
    return `<section class="card"><div class="page-title"><div><div class="eyebrow">Field ${fieldIndex + 1}</div><h3>${esc(fieldData.label)}</h3></div><span class="pill">${esc(fieldData.predicate.operator)}</span></div><div class="message info"><b>Selected clue:</b> ${esc(selectedText)}<br><b>Decoder payload:</b> ${esc(fieldData.clue.decoderPayload)}</div><p><b>Predicate:</b> ${esc(fieldData.predicate.trueLabel)} / ${esc(fieldData.predicate.falseLabel)}</p><div class="truth-preview"><div class="truth-group true"><b>True · 16</b><p>${esc(trueNames.join(', '))}</p></div><div class="truth-group false"><b>False · 16</b><p>${esc(falseNames.join(', '))}</p></div></div><details class="panel"><summary>Catalog classifications</summary><div><table><thead><tr><th>Printed value</th><th>Truth</th><th>Assigned suspects</th></tr></thead><tbody>${fieldData.valueCatalog.map(value => `<tr><td>${esc(value.display)}</td><td>${value.truth ? 'True' : 'False'}</td><td>${Object.entries(result.matrixContent.assignments).filter(([, row]) => row[planned.id] === value.key).length}</td></tr>`).join('')}</tbody></table></div></details></section>`;
  }).join('')}<section class="card"><h3>ELL glossary and source review</h3><p>AI-generated definitions are accepted for teacher review. Each term provides a short definition, a clue-relevant fact, and a concrete example. Glossary pictures are no longer part of the generation or review flow.</p>${result.glossary.map((entry, index) => `<details class="panel"><summary>${index + 1}. ${esc(entry.displayTerm || entry.term)}</summary><div><div class="grid">${field({ label: 'Meaning', path: `generated.glossary.${index}.meaning`, value: entry.meaning, type: 'textarea' })}${field({ label: 'Clue-relevant fact', path: `generated.glossary.${index}.clueRelevantFact`, value: entry.clueRelevantFact, type: 'textarea' })}${field({ label: 'Example', path: `generated.glossary.${index}.example`, value: entry.example, type: 'textarea' })}${field({ label: 'Source URL (teacher only)', path: `generated.glossary.${index}.sourceUrl`, value: entry.sourceUrl })}</div></div></details>`).join('')}</section>`;
}

function findingDisplayLabel(planned) {
  if (P.gameMode === 'matrix') {
    const fieldData = P.generated?.matrixContent?.fields.find(item => item.fieldId === planned.logic.attributeId);
    return fieldData ? (fieldData.clue.selectedPolarity === 'positive' ? fieldData.clue.positiveText : fieldData.clue.negativeText) : planned.logic.requiredLabel;
  }
  if (planned.logic.auto && planned.logic.candidateId) return `${candidateDisplayName(planned.logic.candidateId)} is ruled out`;
  return planned.logic.requiredLabel;
}

function teacherMatrixSummary(result) {
  if (P.gameMode !== 'matrix') return '';
  let remaining = orderedCandidates('suspects', result);
  return `<h3>Five-clue elimination check</h3><table><thead><tr><th>Clue</th><th>Confirmed characteristic</th><th>Remaining</th></tr></thead><tbody>${P.activities.map((activity, index) => {
    const fieldIndex = matrixFields().findIndex(item => item.id === activity.logic.attributeId);
    const bit = P.matrix.rows[P.solution.suspectId][fieldIndex];
    remaining = remaining.filter(suspect => P.matrix.rows[suspect.id][fieldIndex] === bit);
    return `<tr><td>${index + 1}</td><td>${esc(findingDisplayLabel(activity))}</td><td>${remaining.length}</td></tr>`;
  }).join('')}</tbody></table><p>Glossary definitions: AI-generated; teacher-reviewed. Available factual sources remain in the on-screen glossary review.</p>`;
}

function studentPages() {
  const result = P.generated;
  const sections = [];
  const usesM = P.gameMode === 'matrix' && result.matrixContent.fields.some(field => /\bM\b/.test(`${field.clue.positiveText} ${field.clue.negativeText} ${field.clue.decoderPayload}`));
  sections.push(`<div class="brand">A WILLIAM MCADA PRODUCT</div><p>CASE FILE · ${esc(P.course)} · GRADE ${esc(P.grade)}</p><h1>${esc(result.case.title)}</h1><p>${mathText(result.case.hook)}</p><p>Investigators: __________________________________________</p><p>Date: ____________________</p><h2>Case briefing</h2>${renderCaseVisual(result.case.visual)}<p><b>Incident:</b> ${mathText(result.case.incidentSubject)}</p><p>${mathText(result.case.briefing)}</p>${result.case.timeline ? `<h3>Initial timeline</h3><p>${mathText(result.case.timeline)}</p>` : ''}<div class="message info"><b>Evidence rule:</b> ${mathText(result.case.evidenceRule)}</div>${usesM ? '<div class="message info"><b>Clue shorthand:</b> M means the murderer or responsible person. It is not a decoded letter.</div>' : ''}`);
  if (P.gameMode !== 'matrix') sections.push(studentCandidatePages(result));
  sections.push(...vocabularyPages(result));
  let alphabetInserted=false;
  P.activities.forEach((planned, index) => {
    const activity = result.activities.find(item => item.id === planned.id);
    if(activity.extraction.decoder==='Alphabet Code' && !alphabetInserted) {sections.push(alphabetSheet());alphabetInserted=true;}
    sections.push(`<p>INVESTIGATION ${index + 1} · ${planned.minutes} MINUTES · CALCULATOR: ${esc(planned.calculator)}</p><h2>${esc(activity.title)}</h2><p>${mathText(activity.instructions)}</p>${activity.questions.map((question, questionIndex) => `<div class="question"><p><b>${questionIndex + 1}.</b> ${mathText(question.prompt)}</p>${renderTable(question.table)}${question.figureIds.map(id => renderFigure(activity.figures.find(figure => figure.id === id))).join('')}<div class="work"></div></div>`).join('')}<h3>Decode the clue, then cross out candidates</h3><p><b>${mathText(planned.logic.studentFrame)}</b></p>${renderDecoderPanel(activity)}<p class="tracker-caption">Use this clue to cross out candidates on your evidence tracker.</p>`);
  });
  sections.push(...trackerPages(result));
  return sections;
}

function teacherPages() {
  const result = P.generated;
  const sections = [];
  const culprit = result.suspects.find(suspect => suspect.id === P.solution.suspectId)?.name || '—';
  const location = result.locations.find(item => item.id === P.solution.locationId)?.name;
  const object = result.objects.find(item => item.id === P.solution.objectId)?.name;
  sections.push(`<div class="brand">A WILLIAM MCADA PRODUCT</div><h1>${esc(result.case.title)}</h1><h2>Teacher answer materials</h2><div class="message info"><b>Final solution:</b> ${esc(culprit)}${location ? ` · ${esc(location)}` : ''}${object ? ` · ${esc(object)}` : ''}</div><h3>Complete solution explanation</h3><p>${mathText(result.solutionExplanation)}</p><h3>Teaching notes</h3><p>${mathText(result.teachingNotes)}</p>${teacherMatrixSummary(result)}`);
  P.activities.forEach((planned, index) => {
    const activity = result.activities.find(item => item.id === planned.id);
    const replay = replayExtraction(planned, activity);
    sections.push(`<h2>Investigation ${index + 1} · ${esc(activity.title)}</h2><p><b>Primary skill:</b> ${esc(activity.skillSummary.skillLabel)} · ${esc(activity.skillSummary.ccssStandard || planned.standard || 'No standard code')} · Grade ${esc(activity.skillSummary.grade)} · ${esc(planned.difficulty)}</p>${activity.questions.map((question, questionIndex) => `<div class="question"><h3>Response ${questionIndex + 1}: ${mathText(question.answer, true)}</h3><p>${mathText(question.worked)}</p></div>`).join('')}<h3>Answer → decoded evidence → required finding</h3><p><b>${esc(activity.extraction.decoder)} replay:</b> ${esc(replay.decoded)} → ${esc(findingDisplayLabel(planned))}</p><p>${mathText(activity.evidenceNarrative)}</p><p><b>Formal exclusions:</b> ${esc(rulesOutLabel(planned.logic))}</p>`);
  });
  return sections;
}

function publicationPages(kind) {
  const sections = kind === 'student' ? studentPages() : teacherPages();
  return sections.map((content, index) => publicProse(`<section class="sheet"><div class="packet-header"><span>LOGICFORGE · ${esc(GAME_MODES[P.gameMode].name)}</span><span>${kind === 'student' ? 'Student packet' : 'Teacher packet'}</span></div>${printFooter(kind === 'student' ? 'Student' : 'Teacher', index + 1, sections.length)}${content}</section>`)).join('');
}

function renderPublish() {
  const issues = generatedQA();
  const errors = issues.filter(item => item.level === 'error');
  const blocked = errors.length > 0 || !P.reviewed;
  let preview = '';
  if (P.generated) {
    try { validateResultShape(P.generated); preview = publicationPages(printMode); }
    catch (error) { preview = `<div class="message error noprint">${esc(error.message)}</div>`; }
  }
  const reviewMessage = !P.reviewed ? `<div class="message warn"><b>PDF generation is locked:</b> teacher review has not been confirmed. Open Review & check, inspect the packet, check the review statement, and select Confirm teacher review. <button type="button" onclick="go(4)">Go to teacher review</button></div>` : '<div class="message ok">Teacher review is confirmed.</div>';
  return `<div class="noprint"><div class="page-title"><div><div class="eyebrow">Paper publication</div><h2>Student and teacher packets</h2><p class="muted">Use the browser print dialog and choose Save as PDF. Preview every page before saving.</p></div></div><section class="card">${errors.length ? messageList(errors) : '<div class="message ok">No blocking structured errors remain.</div>'}${reviewMessage}<div class="actions"><button type="button" class="${printMode === 'student' ? 'primary' : ''}" onclick="printMode='student';save();render()">Student preview</button><button type="button" class="${printMode === 'teacher' ? 'primary' : ''}" onclick="printMode='teacher';save();render()">Teacher preview</button><button type="button" ${blocked ? 'disabled' : ''} onclick="printPacket()">Print / Save ${printMode} PDF</button></div><p class="muted">The two outputs are deliberately separate. Browser headers and footers can add physical page numbers; LogicForge embeds section numbering and creator attribution.</p></section>${printMode === 'teacher' && P.generated && !P.reviewed ? reviewConfirmationCard(false) : ''}</div>${preview}`;
}

function printPacket() {
  if (!P.reviewed || generatedQA().some(item => item.level === 'error')) return toast('Resolve checks and complete teacher review first.');
  window.print();
}

function download(filename, content) {
  const type = filename.endsWith('.json') ? 'application/json' : 'text/plain;charset=utf-8';
  const url = URL.createObjectURL(new Blob([content], { type }));
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = filename;
  anchor.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function downloadProject() {
  download(`LogicForge_project_v${VERSION}_r${P.revision}.json`, JSON.stringify({ ...P, attribution: BRAND }, null, 2));
}

function migrateV2(old) {
  const migrated = clone(old);
  const { generated: previousResult, reviewed: previousReview, bank: previousBank, attribution: previousAttribution, publication: previousPublication, reviewAcknowledged: previousAcknowledged, migrationArchive: previousArchive, ...oldSpec } = old;
  const reusableContent = old.version === PREVIOUS_VERSION && previousResult?.projectId === old.id && previousResult?.revision === old.revision && previousResult?.designFingerprint === designFingerprint(oldSpec);
  migrated.version = VERSION;
  migrated.revision = Number(old.revision || 1) + 1;
  migrated.generated = null;
  migrated.reviewed = false;
  migrated.reviewAcknowledged = false;
  migrated.publication = { printMode: old.publication?.printMode || 'student' };
  migrated.migrationArchive = previousResult ? { sourceVersion: old.version, sourceRevision: old.revision, generated: clone(previousResult) } : null;
  const oldMatrix = old.matrix || {};
  if (old.gameMode === 'matrix') {
    migrated.matrix = {
      cultureFocus: oldMatrix.cultureFocus || 'United States',
      cultureDepth: oldMatrix.cultural === false ? 1 : 2,
      fields: (oldMatrix.properties || []).map(property => ({
        ...newMatrixField(property.label || 'Field'),
        id: property.id || uid('FIELD'),
        valueType: 'Text category',
        valueMode: property.valueMode === 'Teacher supplied' ? 'Teacher supplied catalog' : 'AI chooses',
        manualCatalog: property.valueMode === 'Teacher supplied' ? `${property.values?.[0] || ''} | false\n${property.values?.[1] || ''} | true` : '',
        predicateMode: property.valueMode === 'Teacher supplied' ? 'Teacher supplied' : 'AI chooses',
        predicateOperator: 'inSet',
        predicateOperand: property.values?.[1] || ''
      })),
      rows: clone(oldMatrix.rows || {})
    };
  } else migrated.matrix = { cultureFocus: 'United States', cultureDepth: 2, fields: [], rows: {} };
  migrated.bank = Array.isArray(old.bank) ? old.bank.map(activity => ({ ...newActivity(), ...activity, logic: blankLogic() })) : [];
  for (const category of ['suspects', 'locations', 'objects']) {
    migrated.candidates[category] = (migrated.candidates[category] || []).map(candidate => ({
      ...candidate,
      nameAuto: candidate.nameAuto ?? false,
      nameGroup: candidate.nameGroup || ''
    }));
    if (category !== 'suspects') migrated.candidates[category].forEach((candidate, index) => {
      const auto = candidate.nameAuto || /^(?:Location|Object)\s+[A-Z]$/i.test(candidate.name);
      candidate.nameMode = auto ? 'AI chooses' : 'Teacher named';
      if (auto) candidate.name = `${category === 'locations' ? 'Location' : 'Object'} ${String.fromCharCode(65 + index)}`;
    });
  }
  if (migrated.candidates.suspects.length && migrated.candidates.suspects.every(candidate => /^Suspect\s+[A-Z]$/i.test(candidate.name))) replaceAutoSuspectNames(migrated.candidates.suspects);
  migrated.activities = (migrated.activities || []).map(activity => ({
    ...newActivity(),
    ...activity,
    autoMath: false,
    autoMathGrade: '',
    logic: { ...blankLogic(), ...(activity.logic || {}) }
  }));
  migrated.activities.forEach(activity => {
    if (!activity.logic.auto) {
      activity.logic.cluePolicy = activity.logic.cluePolicy || 'Teacher-approved exact text';
      return;
    }
    activity.logic.cluePolicy = migrated.gameMode === 'matrix' ? 'AI predicate clue' : migrated.gameMode === 'profile' ? 'Teacher-approved exact text' : 'AI narrative evidence';
    if (activity.logic.cluePolicy === 'AI narrative evidence') {
      activity.logic.clueText = '';
      activity.logic.alternates = '';
    }
  });
  applyGuidedSetup(migrated, false, false);
  ensureDossierOrder(migrated);
  if (reusableContent) {
    const result = clone(previousResult);
    result.version = VERSION;
    result.revision = migrated.revision;
    result.glossary ||= [];
    result.referenceGuides ||= [];
    result.autotags ||= [];
    result.activities.forEach(activity => {
      const planned = migrated.activities.find(item => item.id === activity.id);
      activity.skillSummary ||= { selectionMode: 'teacherSpecified', grade: String(planned?.grade || migrated.grade), skillKey: `legacy_${normalizedWords(planned?.topic || activity.title).replace(/\s+/g, '_') || activity.id.toLowerCase()}`, skillLabel: planned?.topic || activity.title, ccssDomain: '', ccssStandard: planned?.standard || '' };
      if (planned && activity.extraction) activity.extraction.requiredFindingKey = planned.logic.findingKey;
    });
    if (migrated.gameMode === 'matrix' && Array.isArray(previousResult.properties)) {
      const glossary = [];
      const fields = matrixFields(migrated).map((planned, fieldIndex) => {
        const legacy = previousResult.properties.find(item => item.id === planned.id) || { values: [] };
        const valueCatalog = [0, 1].map(truth => {
          const value = legacy.values?.[truth] || {};
          const glossaryId = `GLOSS-${planned.id}-${truth}`;
          glossary.push({ id: glossaryId, term: value.text || `Option ${truth + 1}`, displayTerm: value.text || `Option ${truth + 1}`, meaning: value.meaning || 'A value used in this comparison field.', clueRelevantFact: value.context || `This value belongs to the ${truth ? 'true' : 'false'} group for the field rule.`, example: value.example || `The table uses ${value.text || `option ${truth + 1}`} as a value.`, sourceUrl: value.sourceUrl || '', generalSupport: false, visual: blankGlossaryVisual() });
          return { key: `legacy-${truth}`, display: value.text || `Option ${truth + 1}`, truth, glossaryIds: [glossaryId] };
        });
        const plannedActivity = migrated.activities.find(item => item.logic.attributeId === planned.id);
        const oldActivity = result.activities.find(item => item.id === plannedActivity?.id);
        const culpritBit = migrated.matrix.rows[migrated.solution.suspectId]?.[fieldIndex] || 0;
        const selected = valueCatalog[culpritBit].display;
        return {
          fieldId: planned.id, label: planned.label, valueType: 'Text category', valueCatalog,
          predicate: { operator: 'inSet', trueValueKeys: ['legacy-1'], referenceValueKey: '', operand: null, minimum: null, maximum: null, trueLabel: `is ${valueCatalog[1].display}`, falseLabel: `is ${valueCatalog[0].display}` },
          clue: { positiveText: `M's ${planned.label.toLowerCase()} is ${valueCatalog[1].display}.`, negativeText: `M's ${planned.label.toLowerCase()} is ${valueCatalog[0].display}.`, selectedPolarity: culpritBit ? 'positive' : 'negative', decoderPayload: oldActivity?.extraction?.exactClueText || selected }
        };
      });
      result.matrixContent = {
        compatibilityMode: 'v2.2', fields,
        assignments: Object.fromEntries(migrated.candidates.suspects.map(suspect => [suspect.id, Object.fromEntries(fields.map((field, index) => [field.fieldId, `legacy-${migrated.matrix.rows[suspect.id][index]}`]))]))
      };
      result.glossary = glossary;
      result.autotags = glossary.map((entry, index) => ({ id: `TAG-${index + 1}`, targetType: 'matrixValue', targetId: entry.id.replace(/^GLOSS-/, ''), glossaryId: entry.id }));
      result.referenceGuides = fields.map(field => ({ id: `GUIDE-${field.fieldId}`, fieldId: field.fieldId, title: `${field.label} reference`, introduction: 'Legacy two-value classification retained for compatibility.', rows: field.valueCatalog.map(value => ({ valueKey: value.key, classification: value.truth ? field.predicate.trueLabel : field.predicate.falseLabel, explanation: `For this mystery, ${value.display} is classified as ${value.truth ? field.predicate.trueLabel : field.predicate.falseLabel}.`, glossaryIds: value.glossaryIds })) }));
      delete result.properties;
    } else result.matrixContent ||= { fields: [], assignments: {} };
    const { generated, reviewed, reviewAcknowledged, bank, attribution, publication, migrationArchive, ...specification } = migrated;
    result.designFingerprint = designFingerprint(specification);
    migrated.generated = result;
  }
  return migrated;
}

function migrateV1(old) {
  const migrated = freshProject();
  migrated.id = uid('PROJECT');
  migrated.revision = Number(old.revision || 1) + 1;
  for (const key of ['title', 'grade', 'course', 'minutes', 'difficulty', 'setting', 'tone', 'premise', 'notes']) if (old[key] !== undefined) migrated[key] = old[key];
  migrated.incident = old.victim || 'A serious non-graphic incident requires investigation';
  migrated.gameMode = 'who';
  migrated.advanced = true;
  migrated.packetDecoder = 'Auto-select a compatible method';
  migrated.candidates.suspects = (old.suspects || []).map(suspect => ({ id: suspect.id || uid('SUS'), name: suspect.name || 'Unnamed suspect', nameAuto: false, nameGroup: '' }));
  migrated.candidates.locations = [];
  migrated.candidates.objects = [];
  migrated.solution = { suspectId: old.culprit || migrated.candidates.suspects.at(-1)?.id || '', locationId: '', objectId: '' };
  migrated.activities = (old.activities || []).map((activity, index) => {
    const next = newActivity(activity.topic || '');
    next.id = activity.id || uid('ACT');
    next.clueId = activity.clueId || uid('CLUE');
    next.standard = activity.standard || '';
    next.grade = activity.grade || migrated.grade;
    next.difficulty = activity.difficulty || migrated.difficulty;
    next.minutes = Number(activity.minutes || 10);
    next.countMode = 'Exact';
    next.targetResponses = clamp(Number(activity.count || 8), 1, 30);
    next.minResponses = next.targetResponses;
    next.maxResponses = next.targetResponses;
    next.responseType = activity.response || 'Numeric / symbolic';
    next.representations = activity.representations || '';
    next.figures = activity.figures || 'None';
    next.calculator = activity.calculator || 'No';
    next.constraints = activity.constraints || '';
    next.notes = activity.notes || '';
    const ruledOut = Array.isArray(activity.eliminates) ? activity.eliminates.filter(id => migrated.candidates.suspects.some(candidate => candidate.id === id)) : [];
    const candidate = findCandidate.call(null, ruledOut[0], migrated);
    next.logic = {
      ...blankLogic(),
      auto: false,
      clueAuto: false,
      cluePolicy: 'Teacher-approved exact text',
      reveals: activity.role || 'Establish a custom finding',
      category: 'suspect',
      candidateId: candidate?.id || '',
      requiredLabel: candidate ? `${candidate.name} is ruled out` : (activity.value || 'Custom finding requires review'),
      findingKey: candidate ? `suspect:${candidate.id}:ruled-out` : `migrated:${next.clueId}`,
      rulesOut: ruledOut,
      evidenceNeeded: Array.isArray(activity.depends) ? activity.depends : [],
      clueText: (candidate?.name || activity.value || `CLUE ${index + 1}`).toUpperCase(),
      studentFrame: candidate ? 'The person named below has a confirmed alibi and can be ruled out:' : 'Record the decoded finding:'
    };
    return next;
  });
  if (migrated.activities.length < 3 || migrated.activities.length > 8) throw new Error('The v1 project does not contain 3–8 activities.');
  migrated.bank = [];
  migrated.generated = null;
  migrated.reviewed = false;
  ensureDossierOrder(migrated);
  return migrated;
}

async function openProject(input) {
  try {
    const raw = JSON.parse(await input.files[0].text());
    let next;
    if (raw.format === PROJECT_FORMAT && raw.version === VERSION) next = raw;
    else if (raw.format === PROJECT_FORMAT && [PREVIOUS_VERSION, LEGACY_V2_VERSION, LEGACY_V20_VERSION].includes(raw.version)) next = migrateV2(raw);
    else if (raw.format === 'MMM_PROJECT' && raw.version === '1.0.0') next = migrateV1(raw);
    else throw new Error('This is not a supported LogicForge project.');
    if (!Array.isArray(next.activities) || !next.candidates || !Array.isArray(next.bank)) throw new Error('The project structure is incomplete.');
    const previous = P;
    if (!saveRestorePoint(P)) throw new Error('The current project could not be saved as a restore point. Download it before opening another project.');
    P = next;
    try {
      designQA();
      if (P.generated) { const prepared=prepareResult041(P.generated); P.generated=prepared.result; validateResultShape(P.generated); } 
    } catch (error) {
      P = previous;
      throw error;
    }
    if (raw.version !== VERSION) {
      P.reviewed = false;
      P.reviewAcknowledged = false;
    }
    save();
    activeTab = 0;
    render();
    toast(raw.version === '1.0.0' ? 'The legacy project was migrated to LogicForge v0.4 Advanced mode. Generated v1 content was not carried forward.' : raw.version !== VERSION ? `Project upgraded to LogicForge v${APP_VERSION} / schema v${VERSION}. ${P.generated ? 'Compatible generated content was preserved; review the revised packet layout.' : 'Design settings were preserved. Generate a new result for the updated evidence and naming rules.'}` : `Project opened.${P.reviewed ? ' Its confirmed teacher-review state was restored.' : ' Teacher review is not yet confirmed.'}`);
  } catch (error) { toast(`Open failed: ${error.message}`); }
}

function closeDialog() { document.getElementById('dialogHost').innerHTML = ''; }

function showNewCaseDialog() {
  const suffix = String(P.id || '').split('-').at(-1)?.slice(-8) || 'unknown';
  document.getElementById('dialogHost').innerHTML = `<div class="dialog-backdrop" role="presentation" onclick="if(event.target===this)closeDialog()"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="newCaseTitle"><div class="eyebrow">Protected reset</div><h2 id="newCaseTitle">Start a new case?</h2><p>The current project will first be saved as a local restore point.</p><div class="readout"><b>${esc(P.title)}</b><br>Project …${esc(suffix)} · revision ${P.revision}</div><p class="muted">A generated result JSON is not a project backup. Use Download project backup if you also want a separate file.</p><div class="actions"><button type="button" class="primary" onclick="confirmNewProject(false)">Continue</button><button type="button" onclick="confirmNewProject(true)">Download project backup</button><button type="button" onclick="closeDialog()">Cancel</button></div></section></div>`;
}

function confirmNewProject(downloadFirst) {
  if (downloadFirst) downloadProject();
  if (!saveRestorePoint(P) && !downloadFirst) return;
  const bank = P.bank;
  P = freshProject();
  P.bank = bank;
  save();
  activeTab = 0;
  closeDialog();
  render();
  toast('New case created. The previous project is available under Recent projects.');
}

function showRecentProjects() {
  const items = recentProjects();
  document.getElementById('dialogHost').innerHTML = `<div class="dialog-backdrop" role="presentation" onclick="if(event.target===this)closeDialog()"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="recentTitle"><div class="eyebrow">Recovery</div><h2 id="recentTitle">Recent projects</h2><p class="muted">LogicForge retains the five most recent restore points created before a reset or project replacement.</p>${items.length ? items.map((item, index) => { const project = item.project || {}; const suffix = String(project.id || '').split('-').at(-1)?.slice(-8) || 'unknown'; return `<div class="recent-row"><div><b>${esc(project.title || 'Untitled investigation')}</b><br><span class="muted">Project …${esc(suffix)} · revision ${esc(project.revision || '?')} · ${esc(new Date(item.savedAt).toLocaleString())}</span></div><button type="button" onclick="restoreRecentProject(${index})">Restore</button></div>`; }).join('') : '<div class="message info">No restore points yet.</div>'}<div class="actions"><button type="button" onclick="closeDialog()">Close</button></div></section></div>`;
}

function restoreRecentProject(index) {
  const item = recentProjects()[index];
  if (!item?.project) return toast('That restore point is unavailable.');
  if (!saveRestorePoint(P)) return;
  P = clone(item.project);
  if (P.gameMode === 'matrix') matrixSetup(P, false);
  printMode = P.publication?.printMode || 'student';
  save();
  activeTab = 0;
  closeDialog();
  render();
  toast(`Restored ${P.title}, revision ${P.revision}.`);
}

window.addEventListener('beforeprint', () => {
  if (activeTab !== 5 || !P.reviewed || generatedQA().some(item => item.level === 'error')) {
    document.getElementById('app').hidden = true;
    toast('Publishing is blocked until structured checks and teacher review are complete.');
  }
});
window.addEventListener('afterprint', () => { document.getElementById('app').hidden = false; });

render();
</script>
