<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LogicForge: an offline teacher authoring studio for modular mathematical investigations.">
  <title>LogicForge · v0.4.2</title>
  <style>:root {
  color-scheme: light;
  font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --ink: #202225;
  --muted: #68696b;
  --paper: #f4f0e7;
  --surface: #fffdf8;
  --line: #cbc3b5;
  --line-dark: #8c8478;
  --copper: #a74c22;
  --copper-dark: #743219;
  --amber: #e4a72b;
  --success: #276746;
  --warning: #91620c;
  --danger: #a12835;
  --shadow: 0 7px 24px rgb(31 33 35 / 9%);
}

* { box-sizing: border-box; }
html { background: #dad5cc; }
body { margin: 0; color: var(--ink); background: var(--paper); min-height: 100vh; }
button, input, select, textarea { font: inherit; }
button, .file-button {
  border: 1px solid var(--line-dark);
  background: var(--surface);
  color: var(--ink);
  border-radius: 5px;
  padding: .62rem .9rem;
  cursor: pointer;
  min-height: 42px;
}
button:hover, .file-button:hover { background: #f3e5d8; border-color: var(--copper); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 3px solid rgb(228 167 43 / 55%);
  outline-offset: 2px;
}
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--copper); border-color: var(--copper); color: white; font-weight: 700; }
button.primary:hover { background: var(--copper-dark); }
button.danger { color: var(--danger); }

.app-header {
  display: grid;
  grid-template-columns: minmax(240px, 1fr) auto auto;
  align-items: center;
  gap: 1.5rem;
  padding: 1.25rem max(1.5rem, 4vw);
  background: var(--ink);
  color: white;
  border-bottom: 5px solid var(--copper);
}
.app-header h1 { margin: .1rem 0 0; font: 700 2.15rem/1.05 Georgia, serif; letter-spacing: .02em; }
.brand { font-size: .76rem; letter-spacing: .16em; font-weight: 800; text-transform: uppercase; }
.descriptor { margin-top: .35rem; color: #e6d6c5; }
.header-meta { display: grid; gap: .2rem; color: #d9d6d1; font-size: .86rem; border-left: 1px solid #5c5c5c; padding-left: 1.25rem; }
.actions { display: flex; flex-wrap: wrap; gap: .55rem; align-items: center; }
.app-header button, .app-header .file-button { background: #303337; color: white; border-color: #666; }
.app-header button:hover, .app-header .file-button:hover { background: #494139; border-color: var(--amber); }
.file-button { display: inline-flex; align-items: center; }

nav {
  position: sticky;
  top: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 9px rgb(0 0 0 / 7%);
  padding: 0 max(1.5rem, 4vw);
}
nav button { border: 0; border-radius: 0; border-bottom: 4px solid transparent; background: transparent; color: #555; min-height: 58px; padding: .6rem; }
nav button:hover { background: #f6eee5; }
nav button.active { color: var(--copper-dark); border-bottom-color: var(--copper); font-weight: 800; background: #fbf5ed; }

main { max-width: 1220px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }
footer { padding: 1rem; text-align: center; border-top: 1px solid var(--line); color: #555; font-size: .78rem; background: #e7e1d7; }
h2 { margin: 0; font: 700 1.85rem/1.2 Georgia, serif; }
h3 { font: 700 1.25rem/1.25 Georgia, serif; }
h4 { margin-bottom: .5rem; }
p { white-space: pre-wrap; }
.muted { color: var(--muted); font-size: .9rem; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; font-weight: 800; color: var(--copper-dark); }
.page-title { display: flex; gap: 1rem; align-items: flex-start; justify-content: space-between; margin-bottom: 1.25rem; }
.page-title p { margin: .35rem 0 0; }
.pill { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: .3rem .7rem; font-size: .8rem; background: var(--surface); white-space: nowrap; }
.status-row { display: flex; gap: .55rem; flex-wrap: wrap; margin-top: .8rem; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 7px;
  box-shadow: var(--shadow);
  padding: 1.4rem;
  margin: 1rem 0;
}
.card > h3:first-child { margin-top: 0; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span-2 { grid-column: span 2; }
.stack { display: grid; gap: .7rem; }
.section-divider { border: 0; border-top: 1px solid var(--line); margin: 1.4rem 0; }

.field { display: block; min-width: 0; }
.field-label { display: flex; align-items: center; gap: .38rem; font-size: .88rem; font-weight: 750; color: #393633; }
.field input:not([type="checkbox"]), .field select, .field textarea {
  display: block;
  width: 100%;
  margin-top: .38rem;
  border: 1px solid #afa79b;
  background: white;
  color: var(--ink);
  border-radius: 4px;
  padding: .62rem .7rem;
  min-height: 43px;
}
.field textarea { min-height: 92px; resize: vertical; }
.field input:disabled, .field select:disabled, .field textarea:disabled { background: #eeeae2; color: #555; opacity: 1; }
.readout { display: block; margin-top: .38rem; border: 1px solid var(--line); background: #efebe3; border-radius: 4px; padding: .65rem .7rem; min-height: 43px; }
.field-note { display: block; margin-top: .35rem; color: var(--muted); font-size: .82rem; }
.check { display: flex; align-items: flex-start; gap: .55rem; font-weight: 500; }
.check input { margin-top: .3rem; width: 1rem; height: 1rem; accent-color: var(--copper); }

.help-pop { position: relative; display: inline-block; }
.help-pop summary {
  display: grid;
  place-items: center;
  list-style: none;
  width: 1.25rem;
  height: 1.25rem;
  border-radius: 50%;
  background: #ebe1d3;
  border: 1px solid #ae9980;
  color: var(--copper-dark);
  font-size: .78rem;
  font-weight: 900;
  cursor: pointer;
}
.help-pop summary::-webkit-details-marker { display: none; }
.help-pop[open] summary { background: var(--copper); color: white; }
.help-copy {
  position: absolute;
  left: -.4rem;
  top: 1.65rem;
  z-index: 40;
  width: min(310px, 78vw);
  padding: .8rem;
  border: 1px solid var(--line-dark);
  border-radius: 5px;
  background: #fffdf8;
  color: var(--ink);
  box-shadow: 0 8px 25px rgb(0 0 0 / 18%);
  font-size: .84rem;
  font-weight: 450;
  line-height: 1.45;
}

.mode-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .85rem; }
.mode-card { position: relative; display: block; border: 2px solid var(--line); border-radius: 7px; padding: 1rem; cursor: pointer; background: #fffcf7; }
.mode-card:hover { border-color: #b7815f; }
.mode-card.selected { border-color: var(--copper); background: #fff4e9; box-shadow: inset 0 0 0 1px var(--copper); }
.mode-card input { position: absolute; opacity: 0; pointer-events: none; }
.mode-card strong { display: block; font: 700 1.08rem Georgia, serif; }
.mode-card span { display: block; margin-top: .45rem; color: #5e5b57; font-size: .87rem; }
.mode-summary { border-left: 5px solid var(--amber); background: #fff7df; padding: .85rem 1rem; margin-top: 1rem; }

.metric-band { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; margin: 1rem 0; }
.metric { background: #27292c; color: white; padding: .9rem 1rem; border-radius: 5px; }
.metric span { display: block; color: #d9d1c8; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
.metric strong { display: block; font-size: 1.35rem; margin-top: .15rem; }

.logic-card { border-left: 5px solid var(--copper); }
.auto-note { display: inline-block; margin-top: .65rem; padding: .35rem .55rem; background: #ece8df; color: #5d5852; font-size: .8rem; border-radius: 3px; }
.candidate-list { display: grid; gap: .65rem; }
.candidate-row { display: grid; grid-template-columns: minmax(180px, 1fr) auto auto; gap: .55rem; align-items: end; }
.attribute-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: .55rem; align-items: end; }

.message { padding: .78rem .9rem; margin: .55rem 0; border-left: 5px solid; background: white; }
.message.error { border-color: var(--danger); background: #fff0f2; }
.message.warn { border-color: var(--warning); background: #fff7de; }
.message.ok { border-color: var(--success); background: #edf7f0; }
.message.info { border-color: #4d6584; background: #eef4fb; }
.validation-summary { display: flex; gap: .55rem; flex-wrap: wrap; margin: .8rem 0; }

details.panel { margin: 1rem 0; border: 1px solid var(--line); border-radius: 5px; background: #fff; }
details.panel > summary { cursor: pointer; font-weight: 800; padding: .85rem 1rem; }
details.panel > div { padding: 0 1rem 1rem; }
.mono { width: 100%; min-height: 340px; font: .8rem/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; }
table { width: 100%; border-collapse: collapse; margin: .8rem 0; }
th, td { border: 1px solid #aaa39a; padding: .6rem; text-align: left; vertical-align: top; }
th { background: #ece7de; }

#notice { position: fixed; right: 1rem; bottom: 1rem; z-index: 100; max-width: min(520px, 90vw); padding: .85rem 1rem; background: #202225; color: white; border: 1px solid var(--amber); border-radius: 5px; box-shadow: 0 8px 24px rgb(0 0 0 / 25%); }

.sheet { background: white; padding: 2rem; margin: 1.25rem 0; box-shadow: var(--shadow); }
.sheet h1 { font: 700 2.3rem Georgia, serif; }
.sheet h2 { margin-top: 1.35rem; }
.question { break-inside: avoid; margin: 1rem 0; }
.work, .work-space { height: 88px; border-bottom: 1px solid #d3d3d3; }
.math-expression { display: inline-block; vertical-align: -.18em; font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif; font-size: 1.08em; margin: 0 .08em; }
.math-fallback { display: inline-block; font-family: "Cambria Math", "Times New Roman", serif; border-bottom: 1px dotted #777; }
figure { break-inside: avoid; text-align: center; }
figure svg { max-width: 100%; height: auto; }
figcaption { font-size: .85rem; }
.case-visual { margin: 1rem auto 1.2rem; max-width: 760px; }
.case-visual svg { display: block; width: 100%; border: 1px solid #aaa39a; background: white; }
.math-figure svg { overflow: visible; }
.figure-label { font: 700 15px/1 sans-serif; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; fill: black; }
.measurement-table { width: min(520px, 100%); margin: .7rem auto 0; }
.decoder-panel { border: 2px solid #4e4b47; padding: .85rem; margin: 1rem 0; break-inside: avoid; }
.decoder-grid { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
.decoder-cell { min-width: 55px; border: 1px solid #6b6761; padding: .42rem; text-align: center; background: white; }
.decoder-cell .letter { display: block; font-weight: 800; font-size: 1.05rem; }
.decoder-steps { padding-left: 1.35rem; }
.response-strip { display: flex; flex-wrap: wrap; gap: .45rem; margin: .8rem 0; }
.response-box { width: 62px; min-height: 54px; border: 1.5px solid #595653; background: white; text-align: center; }
.response-box span { display: block; padding: .15rem .3rem; border-bottom: 1px solid #bbb; background: #efebe3; font-size: .72rem; font-weight: 800; }
.response-box b { display: block; min-height: 29px; }
.clue-mask { letter-spacing: .14em; font-size: 1.2rem; overflow-wrap: anywhere; }
.teacher-only { border-left: 5px solid var(--copper); background: #fff5e9; padding: .8rem; }
.printfoot, .print-footer { margin-top: 2rem; padding-top: .55rem; border-top: 1px solid #999; font-size: .68rem; color: #555; }
.matrix-property { border-top: 1px solid var(--line); margin-top: 1rem; padding-top: 1rem; }
.packet-header { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 2px solid #6e4b32; padding-bottom: .45rem; font-size: .76rem; font-weight: 700; color: #504234; }
.elimination-table { width: 100%; table-layout: fixed; }
.elimination-table th, .elimination-table td { padding: .48rem .6rem; overflow-wrap: anywhere; }
.elimination-table .mark-column { width: 54px; text-align: center; }
.elimination-table .name-column { width: 105px; }
.cross-box { display: inline-block; width: 15px; height: 15px; border: 1.2px solid #555; vertical-align: middle; }
.comparison-table { font-size: .78rem; }
.matrix-table { font-size: .78rem; }
.matrix-table td { height: 38px; }
.tracker-caption, .tracker-instruction { font-size: .88rem; }
.final-choice { margin-top: 1.4rem; padding: 1rem 0; border-top: 2px solid #555; }
.vocabulary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem 1.6rem; font-size: .8rem; }
.vocabulary-group { break-inside: avoid; }
.vocabulary-group h3 { margin: .5rem 0; border-bottom: 1px solid #aaa; padding-bottom: .3rem; }
.vocabulary-entry { margin: .65rem 0; break-inside: avoid; }
.vocabulary-entry h4 { margin: 0 0 .15rem; }
.vocabulary-entry p { margin: .15rem 0; }
.vocabulary-context { color: #484848; }
.vocabulary-example { font-style: italic; }
.range-row { display: grid; grid-template-columns: minmax(180px, 1fr) 2fr auto; gap: .8rem; align-items: end; }
.range-value { min-width: 84px; text-align: center; font-weight: 800; }
.field-summary { display: flex; flex-wrap: wrap; gap: .45rem; margin: .45rem 0; }
.truth-preview { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
.truth-group { border: 1px solid var(--line); border-radius: 5px; padding: .7rem; background: #faf8f3; }
.truth-group.true { border-left: 5px solid var(--success); }
.truth-group.false { border-left: 5px solid var(--warning); }
.review-bar { position: sticky; bottom: .75rem; z-index: 18; border: 2px solid var(--copper); box-shadow: 0 8px 28px rgb(0 0 0 / 18%); }
.marker { display: inline-grid; place-items: center; min-width: 1.35em; height: 1.35em; margin-left: .18em; border: 1px solid #555; border-radius: 50%; font-size: .68em; font-weight: 800; vertical-align: super; }
.dialog-backdrop { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 1rem; background: rgb(0 0 0 / 55%); }
.dialog { width: min(720px, 96vw); max-height: 88vh; overflow: auto; background: var(--surface); border: 2px solid var(--copper); border-radius: 8px; padding: 1.25rem; box-shadow: 0 16px 50px rgb(0 0 0 / 35%); }
.dialog h2 { margin-top: 0; }
.recent-row { display: grid; grid-template-columns: 1fr auto; gap: .75rem; align-items: center; border-top: 1px solid var(--line); padding: .8rem 0; }
.reference-card { break-inside: avoid; border: 1px solid #aaa; padding: .7rem; margin: .7rem 0; }
.glossary-visual { max-width: 320px; border: 1px solid #aaa; background: white; }

@media (max-width: 900px) {
  .app-header { grid-template-columns: 1fr; gap: .75rem; }
  .header-meta { border-left: 0; padding-left: 0; }
  nav { grid-template-columns: repeat(3, 1fr); position: static; padding: 0; }
  nav button { min-height: 50px; }
  .grid.three, .grid.four, .mode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 620px) {
  main { padding: 1.2rem .75rem 4rem; }
  .grid, .grid.three, .grid.four, .mode-grid, .metric-band { grid-template-columns: 1fr; }
  .span-2 { grid-column: auto; }
  .candidate-row, .attribute-row { grid-template-columns: 1fr; }
  .page-title { display: block; }
  nav button { font-size: .78rem; }
  .card { padding: 1rem; }
}

@media print {
  @page { size: A4; margin: 14mm; }
  html, body { background: white; }
  .app-header, nav, body > footer, #notice, .noprint { display: none !important; }
  main { max-width: none; margin: 0; padding: 0; }
  .sheet { padding: 0; margin: 0; box-shadow: none; break-after: page; }
  .sheet:last-child { break-after: auto; }
  .elimination-table { font-size: 10pt; }
  .comparison-table { font-size: 8.5pt; }
  .elimination-table th, .elimination-table td { padding: 2.4mm 2mm; }
  .matrix-table td { height: 10mm; }
  .vocabulary-grid { font-size: 9pt; }
  .vocabulary-group h3 { font-size: 11pt; }
  .packet-header { font-size: 9pt; }
  .question, table, figure, .decoder-panel { break-inside: avoid; }
  .case-visual { max-width: 165mm; }
}

<body>
  <header class="app-header">
    <div>
      <div class="brand">A WILLIAM MCADA PRODUCT</div>
      <h1>LogicForge</h1>
      <div class="descriptor">Modular Mathematical Investigations</div>
    </div>
    <div class="header-meta">
      <span>Teacher authoring studio</span>
      <span>v0.4.2 · Offline</span>
    </div>
    <div class="actions noprint">
      <button type="button" onclick="downloadProject()">Save project</button>
      <label class="file-button">Open project<input type="file" hidden accept=".json" onchange="openProject(this)"></label>
      <button type="button" onclick="showRecentProjects()">Recent projects</button>
      <button type="button" onclick="showNewCaseDialog()">New case</button>
    </div>
  </header>
  <nav id="nav" aria-label="Authoring workflow"></nav>
  <main id="app"></main>
  <footer>Designed and built by William McAda · © 2026 William McAda</footer>
  <div id="notice" hidden role="status" aria-live="polite"></div>
  <div id="dialogHost"></div>
  <script>'use strict';

const APP_VERSION = '0.4.2';
const VERSION = '2.3.0';
const PREVIOUS_VERSION = '2.2.0';
const LEGACY_V2_VERSION = '2.1.0';
const LEGACY_V20_VERSION = '2.0.0';
const PROJECT_FORMAT = 'LOGICFORGE_PROJECT';
const RESULT_FORMAT = 'LOGICFORGE_RESULT';
const STORAGE_KEY = 'logicforge-v04-project';
const LEGACY_STORAGE_KEY = 'logicforge-v2-project';
const RECENT_STORAGE_KEY = 'logicforge-v04-recent-projects';
const BRAND = 'Designed and built by William McAda · © 2026 William McAda';
const LEVELS = ['Foundational', 'Accessible', 'Standard Grade-Level', 'Challenging', 'Advanced'];
const DECODERS = ['Auto-select a compatible method', 'Alphabet Code', 'Answer Matching', 'Cross-Out'];
const GAME_MODES = {
  who: {
    name: 'Who Did It?',
    summary: 'Each investigation reveals a case-specific fact. Students connect it to the dossier to clear one innocent suspect.',
    autoNote: 'Assigned by Who Did It? mode so every investigation clears a different innocent suspect through narrative evidence.'
  },
  profile: {
    name: 'Build the Profile',
    summary: 'Each investigation reveals one characteristic. Students compare the accumulated profile with the suspect table.',
    autoNote: 'Assigned by Build the Profile mode. Exclusions are calculated from the generated suspect-attribute table.'
  },
  complete: {
    name: 'Complete the Case',
    summary: 'Case-specific evidence rules out candidates from three independent lists until one person, one place, and one object remain.',
    autoNote: 'Assigned by Complete the Case mode so each narrative finding removes one non-solution candidate.'
  },
  matrix: {
    name: '32-Suspect Mystery',
    summary: 'Five clues reveal five everyday characteristics. Cross out rows as the field narrows from 32 suspects to one, with optional cultural learning.',
    autoNote: 'Five hidden binary predicates and all 32 combinations are fixed by the app. Each printed field may contain varied values, and every clue halves the remaining suspects in any order.'
  }
};
const PROFILE_SUGGESTIONS = [
  ['Access pass', 'Overnight'],
  ['Work shift', 'Evening'],
  ['Equipment allocation', 'Calibration kit'],
  ['Authorized entry', 'East service door'],

const uid = prefix => `${prefix}-${globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2)}`;
const clone = value => JSON.parse(JSON.stringify(value));
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const shuffle = values => {
  const copy = [...values];
  for (let index = copy.length - 1; index > 0; index--) {
    const other = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[other]] = [copy[other], copy[index]];
  }
  return copy;
};

function newCandidate(prefix, name, nameAuto = false, nameGroup = '') {
  return { id: uid(prefix), name, nameAuto, nameGroup };
}

function autoSuspectNames(count) {
  const globalCount = Math.max(1, Math.round(count * .25));
  const entries = [
    ...shuffle(GLOBAL_NAMES).slice(0, globalCount).map(name => ({ name, nameGroup: 'global' })),
    ...shuffle(COMMON_NAMES).slice(0, count - globalCount).map(name => ({ name, nameGroup: 'common' }))
  ];
  return shuffle(entries);
}

function replaceAutoSuspectNames(list) {
  const names = autoSuspectNames(list.length);
  list.forEach((candidate, index) => Object.assign(candidate, names[index], { nameAuto: true }));
}

function randomCandidateId(list) { return list[Math.floor(Math.random() * list.length)]?.id || ''; }

function ensureDossierOrder(project = P, reset = false) {
  project.dossierOrder ||= {};
  for (const category of ['suspects', 'locations', 'objects']) {
    const ids = project.candidates[category].map(item => item.id);
    const old = project.dossierOrder[category];
    if (reset || !Array.isArray(old) || old.length !== ids.length || new Set(old).size !== ids.length || old.some(id => !ids.includes(id))) project.dossierOrder[category] = shuffle(ids);
  }
}

function orderedCandidates(category, result = P.generated) {
  const list = result?.[category] || P.candidates[category];
  return (P.dossierOrder[category] || []).map(id => list.find(item => item.id === id)).filter(Boolean);
}

function shuffleDossier() {
  ensureDossierOrder(P, true);
  touch(true);
  render();
  toast('Dossier order shuffled. Export the updated design for your next AI round trip.');
}

function candidateDisplayName(id, result = P.generated) {
  return ['suspects', 'locations', 'objects'].flatMap(category => result?.[category] || []).find(item => item.id === id)?.name || findCandidate(id)?.name || 'Unknown candidate';
}

function newMatrixField(label) {
  return {
    id: uid('FIELD'), label, valueType: 'Auto', valueMode: 'AI chooses', manualCatalog: '',
    predicateMode: 'AI chooses', predicateOperator: 'inSet', predicateOperand: '', predicateMinimum: '', predicateMaximum: '',
    clueMode: 'AI chooses with manual override', positiveClue: '', negativeClue: '', positivePayload: '', negativePayload: '',
    glossaryGuidance: ''
  };
}

function matrixFields(project = P) { return project.matrix?.fields || project.matrix?.properties || []; }

function matrixSetup(project, reset = false) {
  project.matrix ||= { cultureFocus: 'United States', cultureDepth: 2, fields: [], rows: {} };
  const matrix = project.matrix;
  matrix.cultureFocus ||= 'United States';
  if (![1, 2, 3].includes(Number(matrix.cultureDepth))) matrix.cultureDepth = matrix.cultural === false ? 1 : 2;
  if (!Array.isArray(matrix.fields) && Array.isArray(matrix.properties)) matrix.fields = matrix.properties;
  if (reset || matrix.fields.length !== 5) {
    matrix.fields = chooseFields(project).map(item => ({...newMatrixField(item.label), family:item.family, valueType:item.type, glossaryGuidance:item.hint}));
  } else {
    matrix.fields = matrix.fields.map(field => ({ ...newMatrixField(field.label || 'Field'), ...field, id: field.id || uid('FIELD') }));
  }
  delete matrix.properties;
  delete matrix.cultural;
  const validRows = Object.keys(matrix.rows || {}).length === 32 && project.candidates.suspects.every(item => Array.isArray(matrix.rows[item.id]) && matrix.rows[item.id].length === 5) && new Set(Object.values(matrix.rows).map(row => row.join(''))).size === 32;
  if (reset || !validRows) {
    const combinations = shuffle(Array.from({ length: 32 }, (_, value) => Array.from({ length: 5 }, (_, bit) => (value >> bit) & 1)));
    matrix.rows = Object.fromEntries(project.candidates.suspects.map((item, index) => [item.id, combinations[index]]));
  }
}

function matrixLogic(property, project = P) {
  const index = matrixFields(project).findIndex(item => item.id === property.id);
  const choice = project.matrix.rows[project.solution.suspectId][index];
  return {
    ...blankLogic(), reveals: 'Establish a culprit characteristic', category: 'profile attribute',
    attributeId: property.id, requiredLabel: `${property.label}: option ${choice + 1} (teacher-only)`,
    findingKey: `field:${property.id}:truth:${choice}`, cluePolicy: 'AI predicate clue',
    studentFrame: 'Decode the clue. Use it to cross out every suspect whose value does not satisfy the statement.'
  };
}

function matrixValue(suspectId, propertyId, result = P.generated) {
  const assignment = result?.matrixContent?.assignments?.[suspectId]?.[propertyId];
  const field = result?.matrixContent?.fields?.find(item => item.fieldId === propertyId);
  const entry = field?.valueCatalog?.find(item => item.key === assignment);
  return entry?.display || '';
}

function parseManualCatalog(field) {
  return String(field.manualCatalog || '').split(/\r?\n/).map(line => line.trim()).filter(Boolean).map((line, index) => {
    const parts = line.split('|').map(part => part.trim());
    const truthText = parts.at(-1)?.toLowerCase();
    const truth = ['true', '1', 'yes'].includes(truthText) ? 1 : ['false', '0', 'no'].includes(truthText) ? 0 : null;
    const numeric = field.valueType === 'Number' && parts.length >= 3 ? Number(parts[1]) : null;
    return { line: index + 1, display: parts[0] || '', numericValue: numeric, truth };
  });
}

function matrixIssues() {
  const issues = [];
  const properties = matrixFields();
  const rows = P.matrix?.rows || {};
  if (P.activities.length !== 5 || P.candidates.suspects.length !== 32 || properties.length !== 5) return [issue('error', '32-Suspect Mystery requires exactly 32 suspects, five fields, and five investigations.')];
  if (new Set(properties.map(item => item.id)).size !== 5 || properties.some(item => !item.label?.trim()) || new Set(properties.map(item => item.label.trim().toLowerCase())).size !== 5) issues.push(issue('error', 'Use five distinct field IDs and headings.'));
  if (Object.keys(rows).length !== 32 || P.candidates.suspects.some(item => !Array.isArray(rows[item.id]) || rows[item.id].length !== 5 || rows[item.id].some(bit => bit !== 0 && bit !== 1)) || new Set(P.candidates.suspects.map(item => rows[item.id]?.join(''))).size !== 32) return [...issues, issue('error', 'The suspect grid must contain every binary combination exactly once. Regenerate suggested assignments to repair it.')];
  if (!rows[P.solution.suspectId]) return [...issues, issue('error', 'Choose a final suspect in the 32-row grid.')];
  properties.forEach(property => {
    if (!['Auto', ...CONTRACT.valueTypes].includes(property.valueType)) issues.push(issue('error', `${property.label}: choose a supported value type.`));
    if (!['AI chooses', 'Teacher supplied catalog'].includes(property.valueMode)) issues.push(issue('error', `Choose a value source for ${property.label}.`));
    if (!['AI chooses', 'Teacher supplied'].includes(property.predicateMode)) issues.push(issue('error', `${property.label}: choose a predicate source.`));
    if (!['AI chooses with manual override', 'Teacher supplied'].includes(property.clueMode)) issues.push(issue('error', `${property.label}: choose a clue wording source.`));
    if (property.valueMode === 'Teacher supplied catalog') {
      const catalog = parseManualCatalog(property);
      if (catalog.length < 2 || catalog.some(item => !item.display || item.truth === null || (property.valueType === 'Number' && !Number.isFinite(item.numericValue)))) issues.push(issue('error', `${property.label}: manual catalog lines must classify every value as true or false${property.valueType === 'Number' ? ' and include a numeric value' : ''}.`));
      if (![0, 1].every(truth => catalog.some(item => item.truth === truth))) issues.push(issue('error', `${property.label}: the manual catalog needs both true and false values.`));
      if (new Set(catalog.map(item => normalizedWords(item.display))).size !== catalog.length) issues.push(issue('error', `${property.label}: manual catalog values must be distinct.`));
    }
    if (property.predicateMode === 'Teacher supplied' && !['equals', 'isTrue', 'inSet', 'isOdd', 'isEven', 'divisibleBy', 'greaterThan', 'lessThan', 'betweenInclusive'].includes(property.predicateOperator)) issues.push(issue('error', `${property.label}: choose a supported predicate operator.`));
    if (property.predicateMode === 'Teacher supplied') {
      const op=property.predicateOperator, operand=String(property.predicateOperand??'').trim();
      if(['isOdd','isEven','divisibleBy','greaterThan','lessThan','betweenInclusive'].includes(op)&&!['Number','Auto'].includes(property.valueType)) issues.push(issue('error', `${property.label}: numeric predicates require Number or Auto.`));
      if(['divisibleBy','greaterThan','lessThan'].includes(op)&&(!operand||!Number.isFinite(Number(operand))||(op==='divisibleBy'&&(!Number.isInteger(Number(operand))||Number(operand)===0)))) issues.push(issue('error', `${property.label}: supply a valid numeric operand (nonzero integer divisor).`));
      if(op==='betweenInclusive'&&(!String(property.predicateMinimum).trim()||!String(property.predicateMaximum).trim()||!Number.isFinite(Number(property.predicateMinimum))||!Number.isFinite(Number(property.predicateMaximum))||Number(property.predicateMinimum)>Number(property.predicateMaximum))) issues.push(issue('error', `${property.label}: supply minimum and maximum in ascending order.`));
      if(['inSet','equals'].includes(op)&&!operand) issues.push(issue('error', `${property.label}: describe the target set or value in Predicate operand.`));
    }
    if (property.clueMode === 'Teacher supplied' && [property.positiveClue, property.negativeClue, property.positivePayload, property.negativePayload].some(value => !String(value || '').trim())) issues.push(issue('error', `${property.label}: supply both clue phrasings and both decoder payloads.`));
  });
  if (!P.matrix.cultureFocus?.trim()) issues.push(issue('error', 'Enter a country or region.'));
  if (![1, 2, 3].includes(Number(P.matrix.cultureDepth))) issues.push(issue('error', 'Cultural depth must be Neutral, Familiar, or Deep Dive.'));
  if (new Set(P.activities.map(item => item.logic.attributeId)).size !== 5 || P.activities.some(item => {
    const property = properties.find(property => property.id === item.logic.attributeId);
    return !property || item.logic.findingKey !== matrixLogic(property).findingKey || item.logic.cluePolicy !== 'AI predicate clue' || item.logic.rulesOut.length || item.logic.solveNeeded.length || item.logic.evidenceNeeded.length;
  })) issues.push(issue('error', 'Each investigation must establish one different property using the locked 32-suspect plan.'));
  // Check every nonempty subset, not just the printed clue order.
  for (let mask = 1; mask < 32; mask++) {
    const columns = properties.map((_, index) => index).filter(index => mask & (1 << index));
    const survivors = P.candidates.suspects.filter(item => columns.every(index => rows[item.id][index] === rows[P.solution.suspectId][index]));
    if (survivors.length !== 32 / (2 ** columns.length)) { issues.push(issue('error', 'Every property must halve the remaining suspects, in any clue order.')); break; }
  }
  return issues;
}

function field({ label, path, value, type = 'text', options = null, note = '', disabled = false, min = '', max = '', step = '', span = '', helpText = '' }) {
  const controlId = `field-${String(path).replace(/[^A-Za-z0-9_-]/g, '-')}`;
  let control;
  if (options) {
    const normalized = options.map(option => typeof option === 'string' ? { value: option, label: option } : option);
    control = `<select id="${controlId}" data-path="${esc(path)}" ${disabled ? 'disabled' : ''}>${normalized.map(option => `<option value="${esc(option.value)}" ${String(option.value) === String(value) ? 'selected' : ''}>${esc(option.label)}</option>`).join('')}</select>`;
  } else if (type === 'textarea') {
    control = `<textarea id="${controlId}" data-path="${esc(path)}" ${disabled ? 'disabled' : ''}>${esc(value)}</textarea>`;
  } else {
    control = `<input id="${controlId}" type="${esc(type)}" data-path="${esc(path)}" value="${esc(value)}" ${disabled ? 'disabled' : ''} ${min !== '' ? `min="${esc(min)}"` : ''} ${max !== '' ? `max="${esc(max)}"` : ''} ${step !== '' ? `step="${esc(step)}"` : ''}>`;
  }
  return `<div class="field ${span}"><span class="field-label"><label for="${controlId}">${esc(label)}</label> ${help(label, helpText || undefined)}</span>${control}${note ? `<span class="field-note">${esc(note)}</span>` : ''}</div>`;
}

function readout(label, value, note = '', helpText = '') {

function resizeCandidates(list, size, prefix, noun) {
  if (noun === 'Suspect' && list.length === 0) {
    autoSuspectNames(size).forEach(entry => list.push(newCandidate(prefix, entry.name, true, entry.nameGroup)));
  }
  while (list.length < size) {
    if (noun !== 'Suspect') {
      const candidate = newCandidate(prefix, `${noun} ${String.fromCharCode(65 + list.length)}`, true);
      candidate.nameMode = 'AI chooses';
      list.push(candidate);
      continue;
    }
    const used = new Set(list.map(candidate => candidate.name.toLowerCase()));
    const targetGlobal = Math.max(1, Math.round(size * .25));
    const currentGlobal = list.filter(candidate => candidate.nameGroup === 'global').length;
    const preferred = currentGlobal < targetGlobal ? GLOBAL_NAMES : COMMON_NAMES;
    const backup = currentGlobal < targetGlobal ? COMMON_NAMES : GLOBAL_NAMES;
    const name = shuffle(preferred).find(item => !used.has(item.toLowerCase()))
      || shuffle(backup).find(item => !used.has(item.toLowerCase()))
      || `${noun} ${String.fromCharCode(65 + list.length)}`;
    list.push(newCandidate(prefix, name, true, preferred === GLOBAL_NAMES ? 'global' : 'common'));
  }
  if (list.length > size) list.length = size;
}

function completeCounts(activityCount) {
  const counts = { suspects: 2, locations: 2, objects: 2 };
  const order = ['suspects', 'locations', 'objects'];
  for (let index = 0; index < activityCount - 3; index++) counts[order[index % 3]] += 1;
  return counts;
}

function validSolution(category) {

  const list = P.candidates[category];
  if (!list.some(candidate => candidate.id === P.solution[key])) P.solution[key] = randomCandidateId(list);
  return P.solution[key];
}

function targetLogic(activity, target, mode) {
  if (mode === 'who') {
    return {
      ...blankLogic(),
      reveals: 'Clear a suspect',
      category: 'suspect',
      candidateId: target.id,
      requiredLabel: `${target.name} is ruled out`,
      findingKey: `suspect:${target.id}:ruled-out`,
      rulesOut: [target.id],
      cluePolicy: 'AI narrative evidence',
      clueText: '',
      studentFrame: 'Use the decoded evidence with the candidate dossier. Which person can be ruled out?'
    };
  }
  if (mode === 'complete') {
    const singular = target.category === 'suspects' ? 'suspect' : target.category === 'locations' ? 'location' : 'object';
    return {
      ...blankLogic(),
      reveals: `Rule out a ${singular}`,
      category: singular,
      candidateId: target.id,
      requiredLabel: `${target.name} is ruled out`,
      findingKey: `${singular}:${target.id}:ruled-out`,
      rulesOut: [target.id],
      cluePolicy: 'AI narrative evidence',
      clueText: '',
      studentFrame: `Use the decoded evidence with the candidate information. Which ${singular} can be ruled out?`
    };
  }
  const attribute = target;
  return {
    ...blankLogic(),
    reveals: 'Establish a culprit characteristic',
    category: 'profile attribute',
    attributeId: attribute.id,
    requiredLabel: `${attribute.label} = ${attribute.value}`,
    findingKey: `attribute:${attribute.id}:${attribute.value}`,
    rulesOut: [],
    cluePolicy: 'Teacher-approved exact text',
    clueText: attribute.value.toUpperCase(),
    studentFrame: `The responsible person's ${attribute.label.toLowerCase()} is:`
  };
}

function applyGuidedSetup(project = P, reset = false, randomize = false) {
  const count = project.activities.length;
  if (project.gameMode === 'who') {
    resizeCandidates(project.candidates.suspects, count + 1, 'SUS', 'Suspect');
    project.candidates.locations = [];
    project.candidates.objects = [];
    project.profileAttributes = [];
    const solutionId = project.candidates.suspects.some(candidate => candidate.id === project.solution.suspectId)
      ? project.solution.suspectId
      : randomCandidateId(project.candidates.suspects);
    project.solution = { suspectId: solutionId, locationId: '', objectId: '' };
    let targets = project.candidates.suspects.filter(candidate => candidate.id !== solutionId);
    if (randomize) targets = shuffle(targets);
    project.activities.forEach((activity, index) => {
      if (reset || activity.logic.auto || !activity.logic.findingKey) activity.logic = targetLogic(activity, targets[index], 'who');
    });
  } else if (project.gameMode === 'profile') {
    const suspectCount = Math.max(count + 1, 5);
    resizeCandidates(project.candidates.suspects, suspectCount, 'SUS', 'Suspect');
    project.candidates.locations = [];
    project.candidates.objects = [];
    const solutionId = project.candidates.suspects.some(candidate => candidate.id === project.solution.suspectId)
      ? project.solution.suspectId
      : randomCandidateId(project.candidates.suspects);
    project.solution = { suspectId: solutionId, locationId: '', objectId: '' };
    if (reset) project.profileAttributes = [];
    while (project.profileAttributes.length < count) {
      const suggestion = PROFILE_SUGGESTIONS[project.profileAttributes.length % PROFILE_SUGGESTIONS.length];
      project.profileAttributes.push({ id: uid('ATTR'), label: suggestion[0], value: suggestion[1] });
    }
    project.profileAttributes.length = count;
    let targets = [...project.profileAttributes];
    if (randomize) targets = shuffle(targets);
    project.activities.forEach((activity, index) => {
      if (reset || activity.logic.auto || !activity.logic.findingKey) activity.logic = targetLogic(activity, targets[index], 'profile');
    });
  } else if (project.gameMode === 'matrix') {
    while (project.activities.length < 5) project.activities.push(newActivity());
    project.activities.length = 5;
    resizeCandidates(project.candidates.suspects, 32, 'SUS', 'Suspect');
    project.candidates.locations = [];
    project.candidates.objects = [];
    project.profileAttributes = [];
    if (!project.candidates.suspects.some(item => item.id === project.solution.suspectId)) project.solution.suspectId = randomCandidateId(project.candidates.suspects);
    project.solution.locationId = '';
    project.solution.objectId = '';
    matrixSetup(project, reset);
    const properties = randomize ? shuffle(matrixFields(project)) : matrixFields(project);
    project.activities.forEach((activity, index) => {
      const assigned = matrixFields(project).find(item => item.id === activity.logic.attributeId);
      if (reset || !assigned || activity.logic.findingKey !== matrixLogic(assigned, project).findingKey || activity.logic.cluePolicy !== 'AI predicate clue') activity.logic = matrixLogic(properties[index], project);
    });
  } else {
    const counts = completeCounts(count);
    resizeCandidates(project.candidates.suspects, counts.suspects, 'SUS', 'Suspect');
    resizeCandidates(project.candidates.locations, counts.locations, 'LOC', 'Location');
    resizeCandidates(project.candidates.objects, counts.objects, 'OBJ', 'Object');
    project.profileAttributes = [];
    for (const category of ['suspects', 'locations', 'objects']) {
      const key = `${category.slice(0, -1)}Id`;
      if (!project.candidates[category].some(candidate => candidate.id === project.solution[key])) project.solution[key] = randomCandidateId(project.candidates[category]);
    }
    let targets = ['suspects', 'locations', 'objects'].flatMap(category => {
      const key = `${category.slice(0, -1)}Id`;
      return project.candidates[category].filter(candidate => candidate.id !== project.solution[key]).map(candidate => ({ ...candidate, category }));
    });
    if (randomize) targets = shuffle(targets);
    project.activities.forEach((activity, index) => {
      if (reset || activity.logic.auto || !activity.logic.findingKey) activity.logic = targetLogic(activity, targets[index], 'complete');
    });
  }
  syncAutoLogic(project);
  ensureDossierOrder(project);
}

function findCandidate(id, project = P) {
  return ['suspects', 'locations', 'objects'].flatMap(category => project.candidates[category].map(item => ({ ...item, category }))).find(candidate => candidate.id === id);
}

function findAttribute(id, project = P) {
  return project.profileAttributes.find(attribute => attribute.id === id);
}

function syncAutoLogic(project = P) {
  project.activities.forEach(activity => {
    if (!activity.logic?.auto) return;
    const oldClue = activity.logic.clueText;
    const oldAlternates = activity.logic.alternates;
    const oldPolicy = activity.logic.cluePolicy;
    const clueAuto = activity.logic.clueAuto !== false;
    let next;
    if (project.gameMode === 'matrix') {
      const property = matrixFields(project).find(item => item.id === activity.logic.attributeId);
      if (!property) return;
      next = matrixLogic(property, project);
    } else if (project.gameMode === 'profile') {
      const attribute = findAttribute(activity.logic.attributeId, project);
      if (!attribute) return;
      next = targetLogic(activity, attribute, 'profile');
    } else {
      const candidate = findCandidate(activity.logic.candidateId, project);
      if (!candidate) return;
      next = targetLogic(activity, candidate, project.gameMode);
    }
    if (!clueAuto) {
      next.clueAuto = false;
      next.cluePolicy = oldPolicy;
      next.clueText = oldClue;
      next.alternates = oldAlternates;
    }
    activity.logic = next;
  });
}

function resizeCase(count) {
  if (P.gameMode === 'matrix') return toast('32-Suspect Mystery uses exactly five investigations.');
  if (!count || count === P.activities.length) return;
  if (count < P.activities.length && !confirm('Remove the final investigation slots and update the guided candidate plan?')) return render();
  while (P.activities.length < count) P.activities.push(newActivity());
  P.activities.length = count;
  P.minutes = count === 3 ? 30 : count === 5 ? 55 : count >= 6 ? 95 : count * 11;
  applyGuidedSetup(P, false, false);
  touch(true);
  render();
}

function countRange(activity) {
  return activity.countMode === 'Exact'
    ? { min: Number(activity.targetResponses), max: Number(activity.targetResponses), target: Number(activity.targetResponses) }
    : { min: Number(activity.minResponses), max: Number(activity.maxResponses), target: Number(activity.targetResponses) };
}

function totalBudget() {
  return P.activities.reduce((total, activity) => {
    const range = countRange(activity);
    total.min += range.min;
    total.max += range.max;
    total.target += range.target;
    return total;
  }, { min: 0, max: 0, target: 0 });
}

function autoMathInstruction(grade) {
  return `Any non-redundant Grade ${String(grade || P.grade).trim()} core CCSS mathematics skill. This investigation must use a primary skill not assigned to any other investigation in this packet.`;
}

function autoFillMathematics(replaceAll = false) {
  const grade = String(document.getElementById('autoMathGrade')?.value || P.grade).trim();
  if (!grade) return toast('Choose a grade before auto-filling mathematics.');
  if (replaceAll && !confirm('Replace every investigation topic with the distinct core CCSS instruction? Other investigation settings will remain unchanged.')) return;
  syncGrade(grade);
  let changed = 0;
  P.activities.forEach(activity => {
    if (replaceAll || !activity.topic.trim()) {
      activity.topic = autoMathInstruction(grade);
      activity.grade = grade;
      activity.autoMath = true;
      activity.autoMathGrade = grade;
      changed += 1;
    }
  });
  if (!changed) return toast('No empty investigation topics were found. Use Replace all to overwrite manual topics.');
  touch(true);
  render();
  toast(`${changed} investigation topic${changed === 1 ? '' : 's'} prepared for distinct Grade ${grade} core CCSS skills.`);
}

function clearAutoMathematics() {
  let changed = 0;
  P.activities.forEach(activity => {
    if (activity.autoMath && activity.topic === autoMathInstruction(activity.autoMathGrade || activity.grade)) {
      activity.topic = '';
      activity.autoMath = false;
      activity.autoMathGrade = '';
      changed += 1;
    }
  });
  if (!changed) return toast('No unchanged auto-fill instructions were found.');
  touch(true);
  render();
  toast('Auto-filled placeholders cleared. Manual topics were preserved.');
}

function addActivity(activity = null) {
  if (P.gameMode === 'matrix') return toast('32-Suspect Mystery uses exactly five investigations. Edit or reorder the existing slots.');
  if (P.activities.length >= 8) return toast('A case can contain at most eight investigations.');
  const next = activity ? { ...clone(activity), id: uid('ACT'), clueId: uid('CLUE'), logic: blankLogic() } : newActivity();
  P.activities.push(next);
  applyGuidedSetup(P, false, false);
  touch(true);
  render();
}

function duplicateActivity(index) { addActivity(P.activities[index]); }

function removeActivity(index) {
  if (P.gameMode === 'matrix') return toast('All five investigations are required in 32-Suspect Mystery.');
  if (P.activities.length <= 3) return toast('Keep at least three investigations.');
  if (!confirm('Delete this investigation and update the guided candidate plan?')) return;
  P.activities.splice(index, 1);
  applyGuidedSetup(P, false, false);
  touch(true);
  render();
}

function moveActivity(index, direction) {
  const other = index + direction;
  [P.activities[index], P.activities[other]] = [P.activities[other], P.activities[index]];
  touch(true);
  render();
}

function saveToBank(index) {
  const activity = clone(P.activities[index]);
  activity.logic = blankLogic();
  P.bank.push(activity);
  save();
  toast('Activity specification saved to the project bank.');
}

function addFromBank(index) { addActivity(P.bank[index]); }
function removeBank(index) { P.bank.splice(index, 1); save(); render(); }

async function importBank(input) {
  try {
    const value = JSON.parse(await input.files[0].text());
    if (![VERSION, PREVIOUS_VERSION, LEGACY_V2_VERSION, LEGACY_V20_VERSION].includes(value.version) || !Array.isArray(value.bank)) throw new Error('This is not a supported LogicForge activity bank.');
    value.bank.forEach(activity => P.bank.push({ ...newActivity(), ...activity, logic: blankLogic() }));
    save();
    render();
  } catch (error) { toast(`Bank import failed: ${error.message}`); }
}

function regenerateSuspectNames() {
  if (!confirm('Replace unlocked suspect names with a new varied set? The candidate IDs and final solution will stay the same.')) return;
  const lockedNames=new Map(P.candidates.suspects.filter(x=>x.nameLocked).map(x=>[x.id,x.name]));
  replaceAutoSuspectNames(P.candidates.suspects);
  P.candidates.suspects.forEach(x=>{if(lockedNames.has(x.id))x.name=lockedNames.get(x.id);});
  const used=new Set(lockedNames.values());P.candidates.suspects.filter(x=>!x.nameLocked).forEach(x=>{if(used.has(x.name))x.name=autoSuspectNames(32).map(n=>n.name).find(n=>!used.has(n))||x.name+' '+(used.size+1);used.add(x.name);});
  syncAutoLogic();
  touch(true);
  render();
  toast('Suspect names regenerated. You can still edit any name.');
}

function addCandidate(category) {
  if (P.gameMode === 'matrix') return toast('The grid uses exactly 32 suspects.');
  if (category === 'suspects') {
    const used = new Set(P.candidates.suspects.map(candidate => candidate.name.toLowerCase()));
    const name = shuffle([...COMMON_NAMES, ...GLOBAL_NAMES]).find(item => !used.has(item.toLowerCase())) || `Suspect ${String.fromCharCode(65 + P.candidates.suspects.length)}`;
    P.candidates.suspects.push(newCandidate('SUS', name, true, GLOBAL_NAMES.includes(name) ? 'global' : 'common'));
  } else {
    P.candidates[category].push({ ...newCandidate(category === 'locations' ? 'LOC' : 'OBJ', `${candidateCategoryLabel(category).slice(0, -1)} ${String.fromCharCode(65 + P.candidates[category].length)}`, true), nameMode: 'AI chooses' });
  }
  ensureDossierOrder();
  touch(true);
  render();
}

function removeCandidate(category, index) {
  if (P.gameMode === 'matrix') return toast('The grid uses exactly 32 suspects.');
  if (P.candidates[category].length <= 2) return toast('Keep at least two candidates in each active category.');
  if (!confirm('Remove this candidate? Any logic that references it will require repair.')) return;
  const [removed] = P.candidates[category].splice(index, 1);
  const key = `${category.slice(0, -1)}Id`;
  if (P.solution[key] === removed.id) P.solution[key] = randomCandidateId(P.candidates[category]);
  P.activities.forEach(activity => {
    activity.logic.rulesOut = activity.logic.rulesOut.filter(id => id !== removed.id);
    if (activity.logic.candidateId === removed.id) activity.logic.candidateId = '';
  });
  ensureDossierOrder();
  touch(true);
  render();
}

function toggleLogicList(activityIndex, key, id, checked) {
  const logic = P.activities[activityIndex].logic;
  logic.auto = false;
  logic[key] = checked ? [...new Set([...logic[key], id])] : logic[key].filter(value => value !== id);
  touch(true);
  render();
}

function allCandidateOptions() {
  return ['suspects', 'locations', 'objects'].flatMap(category => P.candidates[category].map(candidate => ({ ...candidate, category })));
}

function rulesOutLabel(logic) {
  if (P.gameMode === 'matrix') {
    const index = matrixFields().findIndex(item => item.id === logic.attributeId);
    const culpritBit = P.matrix.rows[P.solution.suspectId]?.[index];
    return P.candidates.suspects.filter(item => P.matrix.rows[item.id]?.[index] !== culpritBit).map(item => candidateDisplayName(item.id)).join(', ') || '16 suspects, calculated from the fixed grid';
  }
  if (P.gameMode === 'profile' && logic.auto) return 'Calculated from the suspect profile table after import';
  return logic.rulesOut.map(id => candidateDisplayName(id)).join(', ') || 'None';
}

function dependencyLabel(ids) {
  return ids.map(id => {
    const index = P.activities.findIndex(activity => activity.clueId === id);
    return index >= 0 ? `Investigation ${index + 1}` : `Missing clue (${id})`;
  }).join(', ') || 'None';
}

larity; the printed values remain varied.' : 'Candidate names are deliberately excluded from the decoded clue.') : `<div class="grid"><div>${field({ label: 'Primary clue text', path: base + 'clueText', value: logic.clueText, note: 'This wording is approved as equivalent to the required finding.' })}</div><div>${field({ label: 'Approved shorter labels', path: base + 'alternates', value: logic.alternates, note: 'Comma-separated alternatives; leave blank when abbreviations could be ambiguous.' })}</div></div>`}`}

function renderEvidence() {

function approvedClues(logic) {
  if (P.gameMode === 'matrix') return [];
  return [logic.clueText, ...String(logic.alternates || '').split(',')].map(value => value.trim()).filter(Boolean).filter((value, index, all) => all.indexOf(value) === index);
}

function usesGeneratedClue(activity) {
  return ['AI narrative evidence', 'AI property value', 'AI predicate clue'].includes(activity.logic.cluePolicy);
}

function normalizedClue(value) {
  return String(value || '').toUpperCase().replace(/[^A-Z]/g, '');
}

function unsupportedClueCharacters(value) {
  return /\d/.test(String(value)) || /[^A-Za-z\s.,'’&()\-]/.test(String(value));
}

function decoderSetting(activity) {
  return activity.decoderOverride === 'Use packet default' ? P.packetDecoder : activity.decoderOverride;
}

function countAllowed(activity, count) {
  const range = countRange(activity);
  return Number.isInteger(count) && count >= range.min && count <= range.max;
}

function compatiblePlan(activity, clue, method) {
  const length = normalizedClue(clue).length;
  const range = countRange(activity);
  if (!length) return null;
  if (unsupportedClueCharacters(clue)) return null;
  if (method === 'Alphabet Code') return countAllowed(activity, length) ? { method, clue, count: length } : null;
  if (method === 'Answer Matching') {
    const lower = Math.ceil(length / 3);
    const upper = length;
    const minimum = Math.max(range.min, lower);
    const maximum = Math.min(range.max, upper);
    if (minimum > maximum) return null;
    return { method, clue, count: clamp(range.target, minimum, maximum) };
  }
  if (method === 'Cross-Out') {
    const maximum = Math.min(range.max, 40 - length);
    if (range.min > maximum) return null;
    return { method, clue, count: clamp(range.target, range.min, maximum) };
  }
  return null;
}

function compatibleGeneratedPlan(activity, method) {
  const range = countRange(activity);
  const count = clamp(range.target, range.min, range.max);
  if (!Number.isInteger(count) || count < 1) return null;
  if (method === 'Alphabet Code') return { method, clue: '', count, clueLength: { min: count, max: count } };
  if (method === 'Answer Matching') return { method, clue: '', count, clueLength: { min: count, max: count * 3 } };
  if (method === 'Cross-Out' && count < 40) return { method, clue: '', count, clueLength: { min: 1, max: 40 - count } };
  return null;
}

function suggestedExtractionPlan(activity) {
  const setting = decoderSetting(activity);
  const methods = setting === 'Auto-select a compatible method'
    ? ['Answer Matching', 'Cross-Out', 'Alphabet Code']
    : [setting];
  if (usesGeneratedClue(activity)) {
    for (const method of methods) {
      const plan = compatibleGeneratedPlan(activity, method);
      if (plan) return plan;
    }
    return null;
  }
  for (const method of methods) {
    for (const clue of approvedClues(activity.logic)) {
      const plan = compatiblePlan(activity, clue, method);
      if (plan) return plan;
    }
  }
  return null;
}

function decoderCompatibility(activity) {
  const plan = suggestedExtractionPlan(activity);
  const setting = decoderSetting(activity);
  if (plan) {
    if (plan.clueLength) return { ok: true, message: `AI-generated evidence fits ${plan.method} with ${plan.count} mathematical responses; the clue must contain ${plan.clueLength.min === plan.clueLength.max ? plan.clueLength.min : `${plan.clueLength.min}–${plan.clueLength.max}`} encoded letters.` };
    const wording = plan.clue === activity.logic.clueText ? 'primary clue' : `approved label “${plan.clue}”`;
    return { ok: true, message: `${wording} fits ${plan.method} with ${plan.count} mathematical responses.` };
  }
  const clues = approvedClues(activity.logic);
  if (!clues.length) return { ok: false, message: 'Enter a primary clue text before exporting.' };
  if (clues.every(unsupportedClueCharacters)) return { ok: false, message: 'Clue labels contain digits or unsupported characters. Spell out digits or enter an approved alphabetic label.' };
  const range = countRange(activity);
  const example = clues.find(clue => !unsupportedClueCharacters(clue)) || clues[0];
  const length = normalizedClue(example).length;
  if (setting === 'Alphabet Code') return { ok: false, message: `“${example}” contains ${length} encoded letters, but this activity permits ${range.min === range.max ? `${range.min}` : `${range.min}–${range.max}`} responses. Change the approved label, decoder, or explicit budget.` };
  if (setting === 'Answer Matching') return { ok: false, message: `Answer Matching needs between ${Math.ceil(length / 3)} and ${length} responses for “${example}”; this activity permits ${range.min === range.max ? range.min : `${range.min}–${range.max}`}.` };
  if (setting === 'Cross-Out') return { ok: false, message: `Cross-Out would exceed the 40-tile print limit or has no allowed response count for “${example}”.` };
  return { ok: false, message: 'No permitted decoder fits the approved clue wording and response budget.' };
}

function issue(level, text) { return { level, text }; }

function finalCandidates(excluded = new Set()) {
  const remaining = {};
  for (const category of ['suspects', 'locations', 'objects']) remaining[category] = P.candidates[category].filter(candidate => !excluded.has(candidate.id));
  return remaining;
}

function formalEvidenceIssues() {
  const issues = [];
  if (P.gameMode === 'matrix') return matrixIssues();
  if (P.gameMode === 'profile') {
    const ids = P.activities.map(activity => activity.logic.attributeId);
    if (ids.some(id => !findAttribute(id))) issues.push(issue('error', 'Every profile clue must reference an existing profile attribute.'));
    if (new Set(ids).size !== ids.length) issues.push(issue('error', 'Every Build the Profile investigation must establish a different characteristic.'));
    return issues;
  }
  const allRules = P.activities.map(activity => new Set(activity.logic.rulesOut));
  const excluded = new Set(P.activities.flatMap(activity => activity.logic.rulesOut));
  const remaining = finalCandidates(excluded);
  if (P.gameMode === 'who') {
    if (excluded.has(P.solution.suspectId)) issues.push(issue('error', 'The evidence plan rules out the selected final suspect.'));
    if (remaining.suspects.length !== 1 || remaining.suspects[0]?.id !== P.solution.suspectId) issues.push(issue('error', 'The complete evidence must leave exactly the selected suspect.'));
    allRules.forEach((_, omitIndex) => {
      const without = new Set(P.activities.flatMap((activity, index) => index === omitIndex ? [] : activity.logic.rulesOut));
      if (P.candidates.suspects.filter(candidate => !without.has(candidate.id)).length === 1) issues.push(issue('error', `Investigation ${omitIndex + 1} is not necessary; the same suspect is uniquely identified without it.`));
    });
    P.activities.forEach((activity, index) => {
      const alone = new Set(activity.logic.rulesOut);
      if (P.candidates.suspects.filter(candidate => !alone.has(candidate.id)).length === 1) issues.push(issue('error', `Investigation ${index + 1} identifies the final suspect by itself.`));
    });
  } else {
    const keys = { suspects: 'suspectId', locations: 'locationId', objects: 'objectId' };
    for (const category of Object.keys(keys)) {
      if (excluded.has(P.solution[keys[category]])) issues.push(issue('error', `The evidence rules out the selected final ${category.slice(0, -1)}.`));
      if (remaining[category].length !== 1 || remaining[category][0]?.id !== P.solution[keys[category]]) issues.push(issue('error', `The complete evidence must leave exactly one selected ${category.slice(0, -1)}.`));
    }
    allRules.forEach((_, omitIndex) => {
      const without = new Set(P.activities.flatMap((activity, index) => index === omitIndex ? [] : activity.logic.rulesOut));
      const possibilities = ['suspects', 'locations', 'objects'].reduce((product, category) => product * P.candidates[category].filter(candidate => !without.has(candidate.id)).length, 1);
      if (possibilities === 1) issues.push(issue('error', `Investigation ${omitIndex + 1} is not necessary; the complete person–place–object solution remains unique without it.`));
    });
  }
  return issues;
}

function designQA() {
  const issues = [];
  if (!P.title.trim()) issues.push(issue('error', 'Enter a project title.'));
  if (!P.grade.trim() || !P.course.trim()) issues.push(issue('error', 'Enter a grade level and course.'));
  if (!(Number(P.minutes) > 0)) issues.push(issue('error', 'Completion time must be positive.'));
  if (P.activities.length < 3 || P.activities.length > 8) issues.push(issue('error', 'Use between three and eight investigations.'));
  const activityIds = P.activities.map(activity => activity.id);
  const clueIds = P.activities.map(activity => activity.clueId);
  if (new Set(activityIds).size !== activityIds.length || new Set(clueIds).size !== clueIds.length) issues.push(issue('error', 'Activity and clue IDs must be unique.'));
  for (const category of ['suspects', 'locations', 'objects']) {
    const list = P.candidates[category];
    if (!list.length) continue;
    if (list.some(candidate => !candidate.name.trim())) issues.push(issue('error', `${candidateCategoryLabel(category)} cannot contain blank names.`));
    const names = list.map(candidate => candidate.name.trim().toLowerCase());
    if (new Set(names).size !== names.length) issues.push(issue('error', `${candidateCategoryLabel(category)} must have distinct names.`));
    const order = P.dossierOrder?.[category];
    if (!Array.isArray(order) || order.length !== list.length || new Set(order).size !== list.length || order.some(id => !list.some(item => item.id === id))) issues.push(issue('error', `${candidateCategoryLabel(category)} dossier order is invalid. Shuffle dossier order to repair it.`));
    const key = `${category.slice(0, -1)}Id`;
    if (!list.some(candidate => candidate.id === P.solution[key])) issues.push(issue('error', `Select an existing final ${category.slice(0, -1)}.`));
  }
  const findingKeys = [];
  P.activities.forEach((activity, index) => {
    const number = index + 1;
    if (!activity.topic.trim()) issues.push(issue('error', `Investigation ${number}: specify a mathematical skill.`));
    if (!(Number(activity.minutes) > 0)) issues.push(issue('error', `Investigation ${number}: time must be positive.`));
    const range = countRange(activity);
    if (![range.min, range.max, range.target].every(value => Number.isInteger(value) && value >= 1 && value <= 30)) issues.push(issue('error', `Investigation ${number}: response counts must be whole numbers from 1 to 30.`));
    if (range.min > range.target || range.target > range.max) issues.push(issue('error', `Investigation ${number}: target responses must lie within the allowed range.`));
    const compatibility = decoderCompatibility(activity);
    if (!compatibility.ok) issues.push(issue('error', `Investigation ${number}: ${compatibility.message}`));
    if (!activity.logic.reveals.trim() || !activity.logic.requiredLabel.trim() || !activity.logic.findingKey.trim()) issues.push(issue('error', `Investigation ${number}: complete the evidence role, required finding, and finding key.`));
    if (!activity.logic.studentFrame.trim()) issues.push(issue('error', `Investigation ${number}: add an explicit student evidence frame so clue polarity is unambiguous.`));
    findingKeys.push(activity.logic.findingKey);
    for (const [key, label] of [['solveNeeded', 'answer dependency'], ['evidenceNeeded', 'evidence dependency']]) {
      if (activity.logic[key].some(id => !P.activities.slice(0, index).some(earlier => earlier.clueId === id))) issues.push(issue('error', `Investigation ${number}: every ${label} must reference an earlier investigation.`));
    }
    if (activity.logic.rulesOut.some(id => !findCandidate(id))) issues.push(issue('error', `Investigation ${number}: a ruled-out candidate no longer exists.`));
  });
  if (new Set(findingKeys).size !== findingKeys.length) issues.push(issue('error', 'Every investigation needs a distinct finding key.'));
  issues.push(...formalEvidenceIssues());
  if(P.activities.some(a=>a.autoMath&&String(a.autoMathGrade||a.grade)!==String(P.grade))) issues.push(issue('warn','Legacy grade mismatch: auto-filled mathematics uses a different grade from Case Setup. Changing either grade control synchronizes linked activities and requires regeneration. Review the actual question grade before printing.'));
  if (P.advanced) issues.push(issue('warn', 'Advanced overrides are active. Structured checks still run, but any custom causal reasoning requires teacher verification.'));
  if (!issues.some(item => item.level === 'error')) issues.unshift(issue('ok', 'The teacher design, response budgets, decoder choices, and formal evidence plan are internally compatible.'));
  return issues;
}

function messageList(issues) {
  if (!issues.length) return '<div class="message ok">No issues found.</div>';
  return issues.map(item => `<div class="message ${item.level}">${esc(item.text)}</div>`).join('');
}

function projectSpec() {
  const { generated, reviewed, reviewAcknowledged, bank, attribution, publication, migrationArchive, ...specification } = P;
  return clone(specification);
}

function stable(value) {
  if (Array.isArray(value)) return `[${value.map(stable).join(',')}]`;
  if (value && typeof value === 'object') return `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}`;
  return JSON.stringify(value);
}

function designFingerprint(specification = projectSpec()) {
  const normalized = clone(specification);
  if(normalized.contractVersion === '0.4') normalized.incident=normalizeIncident(normalized.incident);
  const source = stable(normalized);
  let hash = 2166136261;
  for (let index = 0; index < source.length; index++) {
    hash ^= source.charCodeAt(index);
    hash = Math.imul(hash, 16777619);
  }
  return `LF-${(hash >>> 0).toString(16).padStart(8, '0').toUpperCase()}`;
}

function matrixGenerationInstructions() {
  if (P.gameMode !== 'matrix') return 'Only generate content for the selected game mode; matrixContent.fields, matrixContent.assignments, glossary, referenceGuides, and autotags stay empty unless useful to another mode.';
  const depth = Number(P.matrix.cultureDepth || 2);
  const culturalInstruction = depth === 1
    ? `CULTURAL DEPTH 1 — NEUTRAL. ${P.matrix.cultureFocus} is a setting only. Use broadly familiar values; no clue may depend on unexplained regional knowledge.`
    : depth === 2
      ? `CULTURAL DEPTH 2 — FAMILIAR. Focus: ${P.matrix.cultureFocus}. Use common regional foods, transport, shops, activities, and everyday details. Define every term an ELL student may not know.`
